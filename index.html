<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>出海达人匹配助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Design: a calm creator-ops workspace. Soft grey canvas, white cards, one indigo accent.
   Numbers in tabular figures; small uppercase labels over big values; status as soft pills. */
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --ink:#0F172A; --muted:#5F6B7D; --faint:#98A2B3; --line:#E4E7EC; --line-2:#EEF0F4;
  --chip:#F1F3F7; --field:#F3F4F7; --hover:#F8F9FB;
  --accent:#4F46E5; --accent-2:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF;
  --good:#0E8A5F; --good-soft:#E6F6EF; --warn:#B45309; --warn-soft:#FEF4E4; --bad:#D92D20; --bad-soft:#FDEDEC;
  --focus:#4F46E5;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
  --shadow-lg:0 16px 40px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
  --tip:#0F172A; --tip-ink:#F8FAFC;
  --display:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --body:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F17; --panel:#121826; --ink:#E6EAF2; --muted:#9AA4B5; --faint:#6B7588; --line:#232B3A; --line-2:#1B2230;
  --chip:#1A2130; --field:#161D2A; --hover:#161D2A;
  --accent:#8B93FF; --accent-2:#B794F6; --accent-ink:#0B0F17; --accent-soft:#1F2147;
  --good:#3DD39A; --good-soft:#10291F; --warn:#F5B547; --warn-soft:#2B210C; --bad:#FF7A70; --bad-soft:#331817;
  --focus:#8B93FF; --tip:#1E2636; --tip-ink:#E6EAF2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0F17; --panel:#121826; --ink:#E6EAF2; --muted:#9AA4B5; --faint:#6B7588; --line:#232B3A; --line-2:#1B2230;
  --chip:#1A2130; --field:#161D2A; --hover:#161D2A;
  --accent:#8B93FF; --accent-2:#B794F6; --accent-ink:#0B0F17; --accent-soft:#1F2147;
  --good:#3DD39A; --good-soft:#10291F; --warn:#F5B547; --warn-soft:#2B210C; --bad:#FF7A70; --bad-soft:#331817;
  --focus:#8B93FF; --tip:#1E2636; --tip-ink:#E6EAF2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;margin:0;font-feature-settings:'cv11','ss01';
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em;letter-spacing:-.01em}
a.ext{color:var(--accent);text-decoration:none;font-weight:500}
a.ext:hover{text-decoration:underline}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:12;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo svg{width:21px;height:21px}
.logo svg circle,.logo svg path{stroke:#fff}
.logo svg circle:last-child{fill:#fff}
h1{font-family:var(--display);font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--muted);font-size:12px;margin-top:1px}
.top-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo-tag{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--chip);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout & stepper ---------- */
.layout{display:grid;grid-template-columns:228px minmax(0,1fr);gap:32px;padding-top:24px}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.steps li{position:relative}
nav.steps li:not(:last-child)::after{content:'';position:absolute;left:22px;top:34px;height:12px;width:2px;border-radius:2px;background:var(--line)}
.step-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:500;transition:background .15s,color .15s}
.step-btn:hover:not(:disabled){background:var(--panel);color:var(--ink)}
.step-btn .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;flex:none;color:var(--muted)}
.step-btn[aria-current="step"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.step-btn[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.step-btn.done{color:var(--ink)}
.step-btn.done .n{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.step-btn:disabled{opacity:.5;cursor:default}
.hand{font-size:10.5px;color:var(--warn);background:var(--warn-soft);font-weight:600;margin-left:auto;white-space:nowrap;padding:1px 7px;border-radius:999px}
.rail-note{margin-top:14px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6}
.rail-note b{color:var(--ink);font-weight:600}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:16px}
  header.top{position:static;backdrop-filter:none;-webkit-backdrop-filter:none}
  nav.steps{position:static}
  nav.steps ol{flex-direction:row;flex-wrap:wrap;gap:4px}
  nav.steps li::after{display:none}
  .step-btn{width:auto;padding:6px 8px}
  .step-btn .lbl{display:none}
  .step-btn[aria-current="step"] .lbl{display:inline}
  .hand,.rail-note{display:none}
}

/* ---------- typography & containers ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding-bottom:4px}
.title-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
h3{font-family:var(--display);font-size:14.5px;font-weight:650;margin:0;letter-spacing:-.005em}
.lead{color:var(--muted);margin:6px 0 0;max-width:70ch;font-size:13.5px}
.takeover{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:5px 11px;border-radius:999px;white-space:nowrap}
.takeover::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.why{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;max-width:none}
.why b{color:var(--ink);font-weight:600}
.lbl-s{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.meta{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);height:36px;padding:0 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,box-shadow .15s,filter .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover);border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.1),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn.dark:hover:not(:disabled){background:var(--ink);filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:all .15s}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-weight:600}
.chip[aria-pressed="true"]::before{content:'✓';font-size:11px}
.chip.static{cursor:default;background:var(--chip);border-color:transparent;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.neutral{background:var(--chip);color:var(--muted)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
textarea,input[type=text],input[type=password],input[type=number],input[type=date],select{width:100%;border:1px solid transparent;background:var(--field);border-radius:9px;padding:9px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
textarea:hover,input:hover,select:hover{border-color:var(--line)}
textarea:focus,input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,input[type=date]:focus,select:focus{outline:none;background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled{opacity:.6}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.inline{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:500;font-size:13px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid2 .full,.grid3 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.callout{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);font-size:13px}
.callout.ask{border-color:color-mix(in srgb,var(--warn) 30%,transparent);background:var(--warn-soft)}
.callout.ask b{color:var(--warn)}
.callout ul{margin:6px 0 0;padding-left:18px}
.funnel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.funnel .stage{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}
.funnel .stage b{font-family:var(--mono);font-size:13px;color:var(--ink);margin-left:3px}
.funnel .arr{color:var(--faint)}

/* ---------- creator list ---------- */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:22px 34px minmax(0,1fr) 168px auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line-2);background:var(--panel);transition:background .15s}
.item:first-child{border-top:0}
.item:hover{background:var(--hover)}
.item.sel{background:color-mix(in srgb,var(--accent-soft) 38%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--mono);color:var(--faint);font-size:12.5px;text-align:center;font-weight:600}
.who{display:flex;gap:12px;min-width:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff;overflow:hidden;box-shadow:0 0 0 2px var(--panel),0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.who-name{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600;font-size:14px}
.handle{color:var(--faint);font-weight:500;font-size:12.5px}
.reason{font-size:13px;color:var(--ink);line-height:1.55}
.risks{display:flex;flex-wrap:wrap;gap:5px}
.score{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.score b{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:-.02em;text-transform:none;margin-left:4px}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
@media (max-width:760px){
  .item{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"c w a" "c s s"}
  .item .rank{display:none}
  .item>input{grid-area:c}
  .item .who{grid-area:w}
  .item .score{grid-area:s}
  .item .act{grid-area:a}
}
.budget{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1;max-width:440px;font-size:12.5px;color:var(--muted)}
.sticky-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-lg);z-index:5}

/* ---------- cards & profile ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
@media (max-width:400px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--field);border-radius:10px;padding:9px 12px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.kv b{font-family:var(--display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:760px){.kv6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.aud{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.aud-row{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;gap:8px;align-items:center}
.aud-row .bar{height:8px}
.aud-row .bar i{background:color-mix(in srgb,var(--muted) 45%,var(--chip))}
.aud-row.hit .bar i{background:var(--good)}
.aud-row em{font-style:normal;font-family:var(--mono);text-align:right;font-size:12px}
.posts{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.posts li{margin:3px 0}
.posts a{color:var(--ink)}

/* engagement benchmark bar (new) */
.bench{display:flex;flex-direction:column;gap:7px;background:var(--field);border-radius:12px;padding:12px 14px}
.bench-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.bench-h b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.bench-track{position:relative;display:flex;gap:3px;height:10px;margin-top:4px}
.bench-track i{height:100%;border-radius:3px;background:var(--line)}
.bench-track i.on{background:var(--good)}
.bench-track i.on.lo{background:#F5A524}
.bench-track i.on.odd{background:var(--bad)}
.bench-track .mk{position:absolute;top:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink);transform:translateX(-6px)}
.bench-scale{display:flex;gap:3px;font-size:11px;color:var(--faint)}
.bench-scale span{text-align:center}

/* price range bar (new) */
.pricebar{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px}
.pb-track{position:relative;height:10px;margin:30px 0 26px;border-radius:99px;background:var(--chip)}
.pb-track i{position:absolute;top:0;height:100%}
.pb-track i.z0{background:color-mix(in srgb,var(--good) 30%,var(--chip));border-radius:99px 0 0 99px}
.pb-track i.z1{background:var(--good)}
.pb-track i.z2{background:#F5A524}
.pb-track i.z3{background:var(--bad);border-radius:0 99px 99px 0}
.pb-track .pk{position:absolute;top:-4px;width:3px;height:18px;border-radius:3px;transform:translateX(-1.5px);background:var(--ink)}
.pb-track .pk em{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.pb-track .pk.ask em{bottom:22px;background:var(--ink);color:var(--panel)}
.pb-track .pk.offer{background:var(--accent)}
.pb-track .pk.offer em{top:22px;background:var(--accent-soft);color:var(--accent)}
.pb-scale{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.pb-scale span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.pb-scale .s1::before{background:var(--good)} .pb-scale .s2::before{background:#F5A524} .pb-scale .s3::before{background:var(--bad)}

/* ---------- mail ---------- */
.mail{border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.mail-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);background:var(--hover)}
.mail-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

function erBench(platform, followers){
  const base = {TikTok:5.2,Instagram:2.6,YouTube:3.4}[platform];

  return +(base*k).toFixed(1);
}

  const base = Math.max(150, c.avgViews/1000*CPM[c.platform]*mkt);
  return {lo:Math.round(base*.8/10)*10, hi:Math.round(base*1.25/10)*10};
}
function genCreators(n){

  const wpick = o => { let t=0; for(const k in o) t+=o[k]; let x=r()*t; for(const k in o){ x-=o[k]; if(x<=0) return k; } return Object.keys(o)[0]; };
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const catKeys = Object.keys(CATS), out=[], used=new Set();
  for(let i=0;i<n;i++){
    const cat = catKeys[i%catKeys.length];
    const cat2 = r()<.35 ? pick(catKeys.filter(k=>k!==cat)) : null;
    const country = wpick(CW);
    const platform = wpick({TikTok:45,Instagram:35,YouTube:20});
    const followers = Math.round(Math.pow(10, 3.6 + r()*2.7)/100)*100;
    const vf = {TikTok:[.08,.45],Instagram:[.03,.15],YouTube:[.06,.3]}[platform];
    let avgViews = Math.round(followers*(vf[0]+r()*(vf[1]-vf[0])));

    let er = +(bench*(.6+r()*1.0)).toFixed(1);
    let fakePct = Math.round(3+r()*12);
    const anomaly = r()<.08;
    if(anomaly){ er = +(bench*(3+r()*1.5)).toFixed(1); fakePct = Math.round(24+r()*18); avgViews = Math.round(avgViews*.4); }
    const region = REGION_OF[country];
    const near = shuffle(Object.keys(REGION_OF).filter(k=>k!==country && REGION_OF[k]===region));
    const far = shuffle(['US','UK','CA','AU'].filter(k=>k!==country && near.indexOf(k)<0));
    const others = near.concat(far).slice(0,2);
    const own = 45 + Math.round(r()*35);
    const s2 = Math.round((100-own)*(.35+r()*.25));
    const s3 = Math.round((100-own-s2)*(.4+r()*.3));
    const aud = {}; aud[country]=own; aud[others[0]]=s2; aud[others[1]]=s3;
    const first = pick(FIRST);
    let handle; do { handle = '@'+first.toLowerCase()+'.'+pick(HANDLE_WORD[cat])+(r()<.5?Math.floor(r()*90+10):''); } while(used.has(handle));
    used.add(handle);
    const posts = shuffle(POSTS[cat]).slice(0,2).concat(cat2 ? [pick(POSTS[cat2])] : [shuffle(POSTS[cat])[0]]);
    const c = {
      id:'c'+String(i+1).padStart(3,'0'), name:first+' '+pick(LAST), first, handle, platform, country, cat, cat2,
      styles:shuffle(Object.keys(STYLES)).slice(0,2), followers, avgViews, er, fakePct, aud,
      female:clamp(Math.round(FEMALE[cat]+(r()-.5)*22),5,97), age:wpick(AGE[cat]),
      responseRate:Math.round(15+r()*55), lastActive: r()<.07 ? Math.round(31+r()*40) : Math.round(r()*9),
      brands:shuffle(BRANDS[cat]).slice(0, r()<.3?0:(r()<.6?1:2)), posts:Array.from(new Set(posts)),
      color:AV_COLORS[i%AV_COLORS.length]

    c.price = priceOf(c);
    out.push(c);
  }
  return out;
}

/* ---------- scoring ---------- */
function riskOf(c, b){
  if(c.real) return riskReal(c, b);
  const r = [];
  if(S.auth && S.auth[c.id]) r.push({lv:'good', t:'已认证受众数据（演示）'});
  const bench = erBench(c.platform, c.followers);
  if(c.fakePct>=20) r.push({lv:'bad', t:'疑似假粉 '+c.fakePct+'%'});
  if(c.er > bench*2.6) r.push({lv:'bad', t:'互动率异常偏高，疑似刷量'});
  if(c.lastActive>30) r.push({lv:'warn', t:c.lastActive+' 天未更新'});
  if(b && b.budgetUsd && c.price.lo > b.budgetUsd*.6) r.push({lv:'warn', t:'单人报价可能超预算'});
  if(c.brands.length && b && (c.cat===b.category)) r.push({lv:'neutral', t:'合作过同品类：'+c.brands[0]});
  return r;
}
function targetShare(c, b){ return sum(b.countries.map(cc=>c.aud[cc]||0)); }
function scoreOf(c, b){
  if(c.real) return scoreReal(c, b);
  const bench = erBench(c.platform, c.followers);
  const share = targetShare(c, b);
  const fCat = c.cat===b.category ? 1 : c.cat2===b.category ? .6 : 0;
  const fAud = Math.min(share/70, 1);
  const fEr = clamp((c.er/bench)/2, 0, 1);
  const styleHit = c.styles.filter(s=>b.styles.indexOf(s)>=0);
  const fStyle = b.styles.length ? (styleHit.length ? 1 : 0) : .5;
  const fGender = b.gender==='female' ? c.female/100 : b.gender==='male' ? (100-c.female)/100 : .7;
  const fQ = 1 - clamp(c.fakePct/40, 0, 1);
  let s = 35*fCat + 25*fAud + 15*fEr + 10*fStyle + 5*fGender + 10*fQ;
  const risks = riskOf(c, b);
  if(risks.some(x=>x.lv==='bad')) s -= 18;
  if(c.lastActive>30) s -= 8;
  const parts = [];
  if(fCat===1) parts.push('内容以'+CATS[c.cat].zh+'为主');
  else if(fCat>0) parts.push('兼做'+CATS[b.category].zh+'内容');
  if(share>0) parts.push('受众 '+share+'% 在'+b.countries.filter(cc=>c.aud[cc]).map(cc=>COUNTRIES[cc]).join('/'));
  parts.push('互动率 '+c.er+'%（同量级参考 '+bench+'%）');
  if(styleHit.length) parts.push('擅长'+styleHit.map(s=>STYLES[s]).join('、'));
  return {score:clamp(Math.round(s),0,100), reason:parts.join('，'), risks};
}
function hardFilter(b){
  const notes = [];
  let fmin=b.followersMin, fmax=b.followersMax, plats=b.platforms.slice(), minShare=15;
  const run = () => LIB.filter(c => plats.indexOf(c.platform)>=0 && c.followers>=fmin && c.followers<=fmax && targetShare(c,b)>=minShare && c.lastActive<=60);
  let pool = run();
  const catHits = p => p.filter(c=>c.cat===b.category||c.cat2===b.category).length;
  if(catHits(pool) < 5){ fmin=Math.round(fmin/2); fmax=fmax*2; pool=run(); notes.push('同品类达人不足 5 位，粉丝量放宽到 '+fmtK(fmin)+'–'+fmtK(fmax)); }
  if(catHits(pool) < 5 && plats.length<3){ plats=PLATFORMS.slice(); pool=run(); notes.push('仍然不足，平台放宽到 TikTok / Instagram / YouTube'); }
  if(catHits(pool) < 3){ minShare=5; pool=run(); notes.push('仍然不足，目标国家受众占比门槛从 15% 降到 5%'); }
  return {pool, notes};
}
function similar(c, exclude){
  const sim = d => {
    const cat = d.cat===c.cat ? 1 : (d.cat2===c.cat||d.cat===c.cat2) ? .5 : 0;
    const st = d.styles.filter(s=>c.styles.indexOf(s)>=0).length/2;
    const reg = REGION_OF[d.country]===REGION_OF[c.country] ? 1 : 0;
    const size = 1 - clamp(Math.abs(Math.log10(d.followers)-Math.log10(c.followers))/1.5, 0, 1);
    return .4*cat + .2*st + .2*reg + .2*size;
  };
  const base = c.real ? S.pool : LIB;
  return base.filter(d=>d.id!==c.id && !exclude.has(d.id) && (d.real ? d.vps>=.01 : d.fakePct<20) && d.lastActive<=30)
    .map(d=>({d, s:sim(d)})).sort((x,y)=>y.s-x.s).slice(0,5);
}

/* ---------- requirement parsing (rules) ---------- */
function parseRule(text){
  const t = text.toLowerCase();
  const b = {product:'', productEn:'', category:null, countries:[], platforms:[], followersMin:10000, followersMax:500000, budgetUsd:null, styles:[], gender:'any', format:'寄样 + 付费短视频'};
  const notes = [];
  let best=null, bc=0;
  for(const k in CATS){ const c = CATS[k].kw.filter(w=>hasKw(t,w)).length; if(c>bc){ bc=c; best=k; } }
  b.category = best;
  for(const reg in REGIONS) if(t.indexOf(reg)>=0) b.countries.push.apply(b.countries, REGIONS[reg]);
  for(const cc in COUNTRY_KW) if(COUNTRY_KW[cc].some(w=>hasKw(t,w))) b.countries.push(cc);
  b.countries = Array.from(new Set(b.countries));
  if(hasKw(t,'tiktok')||hasKw(t,'tk')||t.indexOf('抖音')>=0) b.platforms.push('TikTok');
  if(hasKw(t,'instagram')||hasKw(t,'ins')||hasKw(t,'ig')) b.platforms.push('Instagram');
  if(hasKw(t,'youtube')||hasKw(t,'yt')||t.indexOf('油管')>=0) b.platforms.push('YouTube');
  if(!b.platforms.length){ b.platforms = PLATFORMS.slice(); notes.push('没说平台，默认三个平台都找'); }
  const unit = u => (u==='万'||u==='w') ? 10000 : (u==='k'||u==='千') ? 1000 : 1;
  const fr = t.match(/(\d+(?:\.\d+)?)\s*(万|w|k|千)?\s*(?:到|-|~|至|—)\s*(\d+(?:\.\d+)?)\s*(万|w|k|千)\s*粉?/);
  if(fr){ b.followersMin = Math.round(parseFloat(fr[1])*unit(fr[2]||fr[4])); b.followersMax = Math.round(parseFloat(fr[3])*unit(fr[4])); }
  else if(/头部|大v|百万粉/.test(t)){ b.followersMin=500000; b.followersMax=5000000; }
  else if(/中腰部|腰部/.test(t)){ b.followersMin=50000; b.followersMax=500000; }
  else if(/中小/.test(t)){ b.followersMin=10000; b.followersMax=300000; }
  else if(/素人|小达人|nano|micro|kol小/.test(t)){ b.followersMin=3000; b.followersMax=100000; }
  else notes.push('没说粉丝量级，默认 1 万–50 万');
  let m = t.match(/\$\s*([\d,]+(?:\.\d+)?)\s*(k)?/) || t.match(/(\d+(?:\.\d+)?)\s*(k|千|万)?\s*(?:美元|美金|刀|usd|dollars?)/);
  if(m){ let v=parseFloat(m[1].replace(/,/g,'')); v*=unit(m[2]); b.budgetUsd=Math.round(v); }
  else { m = t.match(/(\d+(?:\.\d+)?)\s*(千|万|w)?\s*(?:元|块|人民币|rmb)/); if(m){ b.budgetUsd=Math.round(parseFloat(m[1])*unit(m[2])/7.2); notes.push('预算按 1 美元 ≈ 7.2 元换算'); } }
  for(const s in STYLE_KW) if(STYLE_KW[s].some(w=>hasKw(t,w))) b.styles.push(s);
  if(/女性|女生|宝妈|女孩|女士|women|female/.test(t)) b.gender='female';
  else if(/男性|男生|男士|men\b|male/.test(t)) b.gender='male';
  const pm = text.match(/(?:一款|做|卖|推广|推)([^，,。；;！!\s]{2,14}?)(?:的|，|,|。|$)/);
  b.product = pm ? pm[1] : (b.category ? CATS[b.category].zh+'类商品' : '');
  const pe = PRODUCT_EN.find(x=>text.indexOf(x[0])>=0);
  b.productEn = pe ? pe[1] : (b.category ? CATS[b.category].en : 'product');
  b.query = b.productEn;
  const q = [];
  if(!b.category) q.push('主推的是哪类商品？比如露营灯、宠物饮水机。');
  if(!b.countries.length){ b.countries=['US']; q.push('想先打哪个国家？没说的话先按美国匹配。'); }
  if(b.budgetUsd==null) q.push('这一轮达人合作的总预算大概多少？');
  if(!b.category) b.category='outdoor';
  return {b, notes, questions:q.slice(0,2)};
}

function detectLang(t){
  if(/[฀-๿]/.test(t)) return 'th';
  if(/[؀-ۿ]/.test(t)) return 'ar';
  if(/[぀-ヿ]/.test(t)) return 'ja';
  if(/[가-힯]/.test(t)) return 'ko';
  if(/[一-鿿]/.test(t)) return 'zh';
  if(/[Ѐ-ӿ]/.test(t)) return 'ru';
  if(/[ऀ-ॿ]/.test(t)) return 'hi';
  if(/[ăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(t)) return 'vi';

  return best;
}

const SPON_RX = /#ad\b|#sponsored|sponsored by|for sponsoring|this video is sponsored|paid promotion|paid partnership|in partnership with|partnered with/i;
const AFF_RX = /affiliate|commission|amzn\.to|amazon\.com\/shop|geni\.us|use (?:my )?code|discount code|promo code|\d+% off/i;
const BW = "[A-Z][\\w&'-]*(?:\\.[a-z]{2,4})?";
const BRAND_RX = [
  new RegExp("[Ss]ponsored [Bb]y:?\\s+@?("+BW+"(?: "+BW+"){0,2})", 'g'),
  new RegExp("[Tt]hanks?\\s+(?:to\\s+)?@?("+BW+"(?: "+BW+"){0,2})\\s+for\\s+sponsoring", 'g'),
  new RegExp("(?:[Pp]artnered|[Pp]artnership) with\\s+@?("+BW+"(?: "+BW+"){0,2})", 'g'),
  new RegExp("code\\s+[A-Z0-9]{3,}\\s+(?:at|on|for)\\s+@?("+BW+"(?: "+BW+")?)", 'g')
];
const BRAND_STOP = new Set(['This','The','My','Our','Today','Check','Use','Get','You','Your','Their','Amazon','YouTube','Instagram','TikTok','Patreon','Link','Links','Me','Us','All','Everyone','For','And','Click','Visit','Shop','Save','Go','Head']);
function scanBrands(text){
  const out = [];
  BRAND_RX.forEach(rx => {
    rx.lastIndex = 0; let m;
    while((m = rx.exec(text))){
      const words = m[1].split(' '); const keep = [];
      for(const w of words){ if(BRAND_STOP.has(w)) break; keep.push(w); }
      const b2 = keep.join(' ').trim();
      if(b2.length<2) continue;
      const head = b2.split(' ')[0].toLowerCase();
      if(out.some(x=>x.split(' ')[0].toLowerCase()===head)) continue;
      out.push(b2);
    }
  });
  return out.slice(0,3);
}
function findEmail(text){
  const re = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi; let m, first = null;
  while((m = re.exec(text||''))){
    const e = m[0].replace(/\.+$/,'');
    if(/example\.|\.(png|jpe?g|gif|webp)$|sentry|wixpress/i.test(e)) continue;
    const ctx = text.slice(Math.max(0, m.index-90), m.index).toLowerCase();
    if(/business|inquir|enquir|collab|sponsor|contact|partner|brand|media|booking/.test(ctx)) return e;
    if(!first) first = e;
  }
  return first;
}

const GENERIC = new Set(['nice','nice video','nice one','great','great video','great content','cool','wow','awesome','amazing','first','love it','love this','good','good video','super','best','beautiful','thanks','thank you','hi','hello','lol','keep it up','very nice','so cool','wonderful','perfect','excellent','great job','well done','fire','sub','subscribed','nice work']);
const LINK_RX = /https?:\/\/|www\.|t\.me\/|wa\.me\/|whatsapp|telegram/i;
function assessWater(c){
  const sig = []; let score = 0;
  const add = (o) => { sig.push(o); score += o.w; };
  const bench = ytBench(c.followers);
  const vp = c.vps*100;
  add({name:'播放 / 订阅', value:vp.toFixed(1)+'%', lv:vp<1?'bad':vp<3?'warn':'good', w:vp<1?35:vp<3?18:0,
       note:'近 10 条平均播放占订阅数的比例。低于 3% 说明大量订阅不活跃，低于 1% 水分很可能偏大'});
  const erx = bench ? c.er/bench : 0;
  add({name:'互动率', value:c.er+'%（参考 '+bench+'%）', lv:erx>3?'warn':'good', w:erx>3?15:0,
       note:erx>3?'超过参考值 3 倍，可能刷过点赞或评论':'（点赞 + 评论）/ 播放，在正常范围'});
  const cm = c.cmts || [];
  if(cm.length>=10){
    const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
    const gen = cm.filter(x=>{ const n = norm(x.t); return !n || (n.length<=20 && GENERIC.has(n)); }).length/cm.length;
    const cnt = {}; cm.forEach(x=>{ const n = norm(x.t); if(n.length>=3) cnt[n]=(cnt[n]||0)+1; });
    const dup = cm.filter(x=>{ const n = norm(x.t); return n.length>=3 && cnt[n]>1; }).length/cm.length;
    const link = cm.filter(x=>LINK_RX.test(x.t)).length/cm.length;
    const ac = {}; cm.forEach(x=>{ if(x.a) ac[x.a]=(ac[x.a]||0)+1; });
    const rp = cm.filter(x=>x.a && ac[x.a]>1).length/cm.length;
    const bot = .4*gen + .3*dup + .2*link + .1*rp;
    add({name:'评论质量', value:'模板 '+Math.round(gen*100)+'% · 重复 '+Math.round(dup*100)+'%'+(link>0?' · 链接 '+Math.round(link*100)+'%':''),
         lv:bot>=.45?'bad':bot>=.25?'warn':'good', w:bot>=.45?20:bot>=.25?10:0,
         note:'抽样 '+cm.length+' 条热门评论。纯表情、“Nice video”类模板评论、重复内容、带链接的评论越多，越像机器人'});
  } else {
    sig.push({name:'评论质量', value:'—', lv:'neutral', w:0, note:c.commentsOff ? '评论区关闭，无法判断' : '评论太少，无法判断'});
  }
  if(c.likeSum>=100){
    const r = c.cmtSum/c.likeSum;
    add({name:'评论 / 点赞', value:Math.round(r*100)+'%', lv:r>.4?'warn':'good', w:r>.4?8:0,
         note:'正常频道的评论数远少于点赞数，评论异常多可能是刷评论'});
  }
  const vl = (c.viewList||[]).filter(x=>x>0);
  if(vl.length>=5){
    const tot = sum(vl), topShare = Math.max.apply(null, vl)/tot;
    const sorted = vl.slice().sort((a,b)=>a-b), med = sorted[Math.floor(sorted.length/2)], ratio = med/(tot/vl.length);
    const spike = topShare>.6, flat = ratio<.25;
    add({name:'播放稳定性', value:'最高一条占 '+Math.round(topShare*100)+'%', lv:spike||flat?'warn':'good', w:spike?10:flat?6:0,
         note:spike ? '播放集中在单条视频，可能是偶然爆款或买过量，平均播放不代表常态' : '中位数 / 平均数 = '+ratio.toFixed(2)+'，越接近 1 越稳定'});
  }
  if(c.since){
    const age = daysAgo(c.since);
    const young = (age<180 && c.followers>=50000) || (age<365 && c.followers>=200000);
    add({name:'频道年龄', value:age>=365 ? (age/365).toFixed(1)+' 年' : age+' 天', lv:young?'warn':'good', w:young?15:0,
         note:young ? '建号时间短、订阅增长偏快，要看增长是否自然' : '平均每天涨 '+fmtK(Math.round(c.followers/Math.max(age,1)))+' 个订阅'});
  }

  return {score, level, signals:sig, top:t ? t.name+' '+t.value : ''};
}

  let pool = list.filter(c=>ok(c) && inC(c) && c.followers>=b.followersMin && c.followers<=b.followersMax);
  if(pool.length<5){
    pool = list.filter(c=>ok(c) && inC(c));
    notes.push('符合条件的频道不足 5 个，订阅数放宽到 '+fmtK(Math.round(b.followersMin/2))+'–'+fmtK(b.followersMax*2));
  }
  if(pool.length<5){
    pool = list.filter(ok);
    notes.push('仍然不足，放开频道国家限制（国家不符的会在风险标签里标出）');
  }

function scoreReal(c, b){
  const bench = ytBench(c.followers);
  const kws = relKw(b);
  c.relRecent = (c.recent||[]).filter(v=>{ const t = v.title.toLowerCase(); return kws.some(w=>t.indexOf(w)>=0); }).length;
  const chText = (c.desc+' '+(c.keywords||[]).join(' ')+' '+(c.topics||[]).join(' ')).toLowerCase();
  c.chRel = kws.some(w=>chText.indexOf(w)>=0);
  const fRel = Math.min((c.hit.n + c.relRecent + (c.chRel?1:0))/4, 1);
  const cFit = !c.country ? null : (b.countries.indexOf(c.country)>=0 ? 1 : 0);
  const lFit = langShare(c, b);
  let fAud = cFit==null && lFit==null ? .5 : cFit==null ? lFit : lFit==null ? cFit : (cFit+lFit)/2;
  const au = S.auth && S.auth[c.id];
  const aSh = au ? authShare(au, b) : null;
  if(aSh!=null) fAud = Math.min(aSh/70, 1);
  const fEr = c.er ? clamp((c.er/bench)/2, 0, 1) : .3;
  const styleHit = c.styles.filter(s=>b.styles.indexOf(s)>=0);
  const fStyle = b.styles.length ? (styleHit.length ? 1 : 0) : .5;
  const fAct = .6*(c.lastActive<=14 ? 1 : c.lastActive<=30 ? .6 : .2) + .4*clamp(c.perWeek, 0, 1);
  const fReach = clamp(c.vps/.15, 0, 1);
  let s = 30*fRel + 20*fAud + 15*fEr + 15*fReach + 10*fStyle + 10*fAct;
  const risks = riskReal(c, b);
  if(risks.some(x=>x.lv==='bad')) s -= 18;
  if(c.sponCount>=6) s -= 5;
  if(c.water && c.water.level==='中') s -= 6;
  const t0 = c.hit.titles[0] || '';
  const parts = ['搜索命中 '+c.hit.n+' 条、最近 10 条里 '+c.relRecent+' 条相关，如“'+(t0.length>30?t0.slice(0,30)+'…':t0)+'”'];
  parts.push('近 10 条平均播放 '+fmtK(c.avgViews)+'（订阅的 '+Math.round(c.vps*100)+'%）');
  parts.push('互动率 '+c.er+'%（参考 '+bench+'%）');
  if(aSh!=null) parts.push('已认证受众 '+aSh+'% 在目标市场');
  else if(lFit!=null) parts.push('评论 '+Math.round(lFit*100)+'% 用'+targetLangNames(b));
  parts.push(c.country ? '频道国家：'+ctry(c) : '频道未公开国家');
  if(c.brands.length) parts.push('合作过 '+c.brands.slice(0,2).join('、'));
  if(styleHit.length) parts.push('常做'+styleHit.map(x=>STYLES[x]).join('、'));
  return {score:clamp(Math.round(s),0,100), reason:parts.join('，'), risks};
}

      questions = Array.isArray(j.questions) ? j.questions.map(String).slice(0,2) : [];
      src='ai';
    }
  }
  S.brief=b; S.notes=notes; S.questions=questions; S.briefSrc=src;
  S.sender.productEn = b.productEn;
  S.results=[]; S.selected=new Set(); S.emails={}; S.checked=new Set(); S.deals={}; S.report=null; S.tSend=null; S.max=2;
  go(2);
}

function readBrief(){
  const b = S.brief;
  b.product = $('#f-product').value.trim();
  b.category = $('#f-cat').value;
  b.followersMin = Math.max(0, parseInt($('#f-fmin').value,10)||0);
  b.followersMax = Math.max(b.followersMin+1000, parseInt($('#f-fmax').value,10)||500000);
  const bv = parseInt($('#f-budget').value,10); b.budgetUsd = bv>0 ? bv : null;
  b.gender = $('#f-gender').value;
  b.format = $('#f-format').value.trim() || '寄样 + 付费短视频';
  const grp = g => Array.from(document.querySelectorAll('[data-group="'+g+'"] .chip[aria-pressed="true"]')).map(x=>x.dataset.k);
  b.countries = grp('countries'); b.styles = grp('styles');
  if(S.source==='youtube'){ b.platforms = ['YouTube']; const q = $('#f-query'); b.query = (q && q.value.trim()) || b.productEn || CATS[b.category].en; }
  else b.platforms = grp('platforms');
  if(!b.countries.length){ toast('至少选一个目标国家'); return false; }
  if(!b.platforms.length){ toast('至少选一个平台'); return false; }

}
async function doMatch(skipRead){
  if(!skipRead && !readBrief()) return;
  const b = S.brief;
  let scored;
  S.ytError = '';
  if(S.source==='youtube'){
    if(!S.ytKey){ S.ytError = '先在第 1 步填写并保存 YouTube API Key。'; render(); return; }
    S.busy='yt'; render();
    try {
      const r = await ytFetch(b);
      const f = realFilter(r.shortlist, b);
      S.busyMsg = '读取'+ctry({country:b.countries[0]})+'的 YouTube 热门榜…'; render();
      S.trending = await ytTrending(b);
      S.pool = f.pool; S.relax = f.notes; S.realStats = {searched:r.searched, channels:r.channels, detailed:r.shortlist.length, query:b.query, region:b.countries[0]};
    } catch(e){ S.busy=''; S.busyMsg=''; S.ytError = (e && e.message) || String(e); render(); return; }
    S.busy=''; S.busyMsg='';
  } else {
    const f = hardFilter(b); S.pool = f.pool; S.relax = f.notes; S.realStats = null;
  }
  PERF_CACHE = loadPerf();
  scored = S.pool.map(c=>Object.assign({id:c.id, src:'rule'}, withHistory(c, scoreOf(c,b)))).sort((x,y)=>y.score-x.score);
  let top = scored.slice(0,10);
  S.rankSrc='rule';
  if(S.mode==='ai' && scored.length){
    S.busy='rank'; render();
    const cands = scored.slice(0,20).map(x=>Object.assign(candJson(BY_ID[x.id], x.score), histJson(x.id)));
    const prompt = '你是出海品牌的达人营销助手。根据品牌需求，从候选达人里选出最合适的 10 位，按合适程度从高到低排序。\n'
      +'规则：\n- 只能使用下面给出的数据，不要编造任何数字或事实。\n- reason 用中文一句话，不超过 45 字，必须引用具体数据（如目标国家受众占比、互动率、内容方向、某条近期作品）。\n- score 为 0-100 的整数。\n- fake_pct 高、互动率远高于 er_bench、或 views_per_sub 很低的达人要降分。\n- past_campaign 是我们和这位达人合作的真实结果：rating 为“优先复投”的加分，“不建议复投”的降分，reason 里要提到。\n- 数据里没有的字段（比如真实频道没有受众画像）不要推测；comment_languages 只是评论语言分布，不等于受众国家。\n'
      +'只回复 JSON 数组，例如：[{"id":"c012","score":88,"reason":"……"}]\n\n'
      +'品牌需求：'+JSON.stringify({product:b.product, category:CATS[b.category].zh, countries:b.countries, platforms:b.platforms, followers:[b.followersMin,b.followersMax], budget_usd:b.budgetUsd, styles:b.styles.map(s=>STYLES[s]), gender:b.gender})+'\n\n'
      +'候选达人：\n'+cands.map(c=>JSON.stringify(c)).join('\n');
    const j = await aiJson(prompt);
    S.busy='';
    if(Array.isArray(j)){
      const seen = new Set(), byId = Object.fromEntries(scored.map(x=>[x.id,x]));
      const ai = j.filter(x=>x && byId[x.id] && !seen.has(x.id) && seen.add(x.id)).slice(0,10)
        .map(x=>Object.assign({}, byId[x.id], {score:clamp(parseInt(x.score,10)||byId[x.id].score,0,100), reason:String(x.reason||byId[x.id].reason).slice(0,90), src:'ai'}));
      if(ai.length>=5){ top=ai; S.rankSrc='ai'; }
    }
  }
  S.results = top.map((x,i)=>Object.assign(x,{rank:i+1}));
  S.lookalikeIds = new Set();
  S.selected = new Set();
  S.max = 3;
  go(3);
}

function authShare(au, b){ if(!au || !b) return null; return Math.round(sum(b.countries.map(cc=>au.countries[cc]||0))); }
function makeAuthData(c, plat){
  const r = rng(hashStr(c.id)+31);
  let countries = {};
  if(!c.real && c.aud && Object.keys(c.aud).length){
    Object.keys(c.aud).forEach(k=>{ countries[k] = c.aud[k]; });
  } else {
    const b = S.brief;
    const main = c.country || (b && b.countries[0]) || 'US';
    const ls = b ? langShare(c, b) : null;
    let rest = 100;
    const mainShare = Math.round(ls!=null ? 30 + ls*45 : 40 + r()*30);
    countries[main] = mainShare; rest -= mainShare;
    const pool = ['US','UK','CA','AU','PH','DE','MY'].filter(x=>x!==main);
    for(let i=0;i<3 && rest>4;i++){
      const k = pool[Math.floor(r()*pool.length)]; if(countries[k]) continue;
      const v = Math.round(rest*(.3+r()*.25)); countries[k] = v; rest -= v;
    }
  }
  const base = [.06,.32,.36,.17,.09].map(x=>x*(.75+r()*.5)); const tot = sum(base);
  const ageKeys = ['13-17','18-24','25-34','35-44','45+'];
  const ages = {}; ageKeys.forEach((k,i)=>{ ages[k] = Math.round(base[i]/tot*100); });
  const female = c.female!=null ? c.female : Math.round(30+r()*40);
  return {platform:plat, at:Date.now(), countries, ages, female, reach:Math.round((c.avgViews||0)*(.8+r()*.5))};
}

function moneyIn(text){ const a = []; String(text).replace(/\$\s?(\d[\d,]*)/g, (m,x)=>{ a.push(+x.replace(/,/g,'')); return m; }); return a; }
function parseReplyRule(text){
  const nums = moneyIn(text);
  const declined = /(fully booked|not taking|have to pass|i'?ll pass|not a fit|no thanks|not interested|decline)/i.test(text);
  const questions = (text.match(/[^.!?\n]*\?/g)||[]).map(x=>x.trim()).filter(Boolean);
  const usage = /usage|whitelist|\bads\b/i.test(text);
  const m = /within (\d+) (day|week)s?/i.exec(text);
  return {
    intent: declined ? 'declined' : questions.length ? 'question' : 'interested',
    ask: declined ? null : (nums[0] || null), usageFee: usage && nums[1] ? nums[1] : null,
    days: m ? (+m[1])*(m[2].toLowerCase()==='week'?7:1) : null, exclusivity: /exclusiv/i.test(text), questions
  };
}

          days:j.timeline_days==null?null:+j.timeline_days, exclusivity:!!j.exclusivity_asked, questions:Array.isArray(j.questions)?j.questions.map(String).slice(0,4):p.questions};

function negStats(platform, exceptId){
  const all = loadNeg(), rows = [];
  Object.keys(all).forEach(id=>{ if(id!==exceptId) all[id].forEach(r=>{ if(r.platform===platform) rows.push(r); }); });
  if(!rows.length) return null;
  const avg = a => sum(a)/a.length;
  // Price comparisons only make sense for fixed-fee deals; a fee with commission on top is not the same price.
  const fx = rows.filter(r=>r.model==='fixed');
  if(!fx.length) return null;
  return {n:fx.length, vsHi:avg(fx.map(r=>r.final/r.hi)), cut:avg(fx.map(r=>1-r.final/r.firstAsk)), rounds:avg(rows.map(r=>r.rounds))};

function suggestDeal(c, d){
  const p = d.parsed, lo = c.price.lo, hi = c.price.hi, left = budgetLeft();
  if(p.intent==='declined') return {kind:'lost', t:'达人婉拒了。建议礼貌回复、标记为“未合作”，回到第 3 步补一位相似达人。'};
  const ask = p.ask;
  if(!ask) return {kind:'ask', offer:hi, model:'fixed', t:'回复里没有报价。先回答达人的问题，再请对方给出一条视频的报价。'};
  const over = Math.round((ask/hi-1)*100);
  if(d.round>=2 && d.model==='hybrid'){
    // With commission on top, the fixed fee should sit below a fixed-only deal: judge it against the middle of the range.
    const mid = r10((lo+hi)/2);
    if(ask<=mid) return {kind:'accept', offer:ask, model:'hybrid', t:'第 '+d.round+' 轮，达人接受了佣金模式，固定费要 '+money(ask)+'，不超过区间中位 '+money(mid)+'。建议接受。'};
    if(d.round>=3) return {kind:'final', offer:mid, model:'hybrid', t:'已经谈了 '+d.round+' 轮，固定费还差 '+money(ask-mid)+'。建议报最终价：固定费 '+money(mid)+' + '+d.rate+'% 佣金，不行就放弃，换下一位达人。'};
    if(ask<=hi) return {kind:'counter', offer:mid, model:'hybrid', t:'达人接受了佣金模式，但固定费 '+money(ask)+' 偏高。有佣金兜底，固定费应低于纯固定合作，建议还到区间中位 '+money(mid)+'，佣金 '+d.rate+'% 不变。'};
    return {kind:'final', offer:mid, model:'hybrid', t:'固定费 '+money(ask)+' 再加佣金，比纯固定合作的上限 '+money(hi)+' 还贵，不划算。建议报最终价：固定费 '+money(mid)+' + '+d.rate+'% 佣金，不行就放弃。'};
  }
  if(d.round>=2 && ask<=hi*1.1) return {kind:'accept', offer:ask, model:d.model, t:'第 '+d.round+' 轮，达人让步到 '+money(ask)+'，'+(over>0?'只比估算上限高 '+over+'%':'已在估算区间内')+'。建议接受，再谈容易谈崩。'};
  if(d.round>=3) return {kind:'final', offer:hi, model:d.model, t:'已经谈了 '+d.round+' 轮，报价 '+money(ask)+' 仍比估算上限高 '+over+'%。建议报最终价 '+money(hi)+'，不行就放弃，换下一位达人，别拖慢上线。'};
  if(left!=null && Math.min(ask, hi) > left) return {kind:'over', offer:Math.min(ask, hi), model:'fixed', t:'剩余预算只有 '+money(Math.max(0,left))+'，不够这次合作。建议先暂缓，或者把预算从别的达人那里挪过来。'};
  if(ask<=hi) return {kind:'accept', offer:ask, model:'fixed', t:'报价 '+money(ask)+' 在估算区间 '+money(lo)+'–'+money(hi)+' 内，建议直接接受。'};
  if(ask<=hi*1.3) return {kind:'counter', offer:hi, model:'fixed', t:'报价 '+money(ask)+'，比估算上限高 '+over+'%。建议还价到 '+money(hi)+'，并表达长期合作的意愿。'};
  return {kind:'hybrid', offer:lo, model:'hybrid', t:'报价 '+money(ask)+'，比估算上限高 '+over+'%，差距较大。建议改成“固定费 '+money(lo)+' + '+d.rate+'% 销售佣金”，用带货效果来补差价。'};
}

const STOP = new Set(['and','the','for','with','easy','use','one','your','you','are']);
function covers(low, p){
  const words = (p.toLowerCase().match(/[a-z0-9-]+/g)||[]).filter(w=>w.length>=3 && !STOP.has(w));
  if(!words.length) return low.indexOf(p.toLowerCase())>=0;
  return words.filter(w=>low.indexOf(w)>=0).length >= Math.ceil(words.length/2);
}

function markQuotes(text, items){
  const qs = items.map(x=>x.quote).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!qs.length) return esc(text);
  const low = text.toLowerCase(), marks = [];
  qs.forEach(q=>{ let i = low.indexOf(q.toLowerCase()); while(i>=0){ if(!marks.some(m=>i<m[1] && i+q.length>m[0])) marks.push([i, i+q.length]); i = low.indexOf(q.toLowerCase(), i+q.length); } });
  marks.sort((a,b)=>a[0]-b[0]);
  let out = '', at = 0;
  marks.forEach(([a,b])=>{ out += esc(text.slice(at,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; at = b; });
  return out + esc(text.slice(at));
}

}
// Reach against the creator's usual views decides first, then cost against the rest of the campaign.
// ROI is shown but not used here: one seeding video rarely pays back on its own.
function ratingOf(m, medCpm){
  if(m.idx<.6) return '不建议复投';
  if(m.idx>=.9 && m.cpm<=medCpm) return '优先复投';
  return '可以再合作';
}
function medianOf(a){ if(!a.length) return 0; const s = a.slice().sort((x,y)=>x-y), i = Math.floor(s.length/2); return s.length%2 ? s[i] : (s[i-1]+s[i])/2; }
function resultRows(){
  const rows = dealList(['approved','live','done']).map(x=>Object.assign(x, {m:metricsOf(x.c, x.d)}));
  const med = medianOf(rows.filter(x=>x.m).map(x=>x.m.cpm));
  rows.forEach(x=>{ if(x.m) x.rating = ratingOf(x.m, med); });
  return rows;
}
const usd2 = n => '$'+(Math.round(n*100)/100).toFixed(2);
function reportText(rows, summary){
  const done = rows.filter(x=>x.m), b = S.brief;
  const tc = sum(done.map(x=>x.m.cost)), tv = sum(done.map(x=>x.m.views)), te = sum(done.map(x=>x.m.eng)), tr = sum(done.map(x=>x.m.rev));
  const lines = ['达人营销复盘：'+S.sender.brand+' '+prodEn(), '市场：'+b.countries.map(x=>COUNTRIES[x]).join('、')+' · 平台：'+b.platforms.join('、'), ''];
  lines.push('总花费 '+money(tc)+' · 总播放 '+tv.toLocaleString('en-US')+' · 总互动 '+te.toLocaleString('en-US'));
  lines.push('综合 CPM '+usd2(tv?tc/tv*1000:0)+' · 综合 CPE '+usd2(te?tc/te:0)+(tr?' · 销售额 '+money(tr)+' · ROI '+(tc?(tr/tc).toFixed(2):'–'):''));
  lines.push('');
  done.sort((x,y)=>x.m.cpm-y.m.cpm).forEach((x,i)=>{
    lines.push((i+1)+'. '+x.c.name+'（'+x.c.platform+'）'+x.rating);
    lines.push('   花费 '+money(x.m.cost)+'，播放 '+x.m.views.toLocaleString('en-US')+'（达预期 '+Math.round(x.m.idx*100)+'%），互动率 '+x.m.er.toFixed(1)+'%，CPM '+usd2(x.m.cpm)+'，CPE '+usd2(x.m.cpe)+(x.m.rev?'，销售额 '+money(x.m.rev)+'，ROI '+(x.m.roi||0).toFixed(2):''));
    if(x.d.video && x.d.video.src==='sample') lines.push('   （示例数据）');

function ruleSummary(rows){
  const done = rows.filter(x=>x.m);
  if(!done.length) return '还没有发布数据。';
  const out = [];
  const top = done.filter(x=>x.rating==='优先复投').sort((x,y)=>x.m.cpm-y.m.cpm), weak = done.filter(x=>x.rating==='不建议复投');
  const best = top[0] || done.slice().sort((x,y)=>x.m.cpm-y.m.cpm)[0];
  out.push('成本最低的是 '+best.c.name+'：CPM '+usd2(best.m.cpm)+'，播放达到平时的 '+Math.round(best.m.idx*100)+'%'+(top.length?'，下次优先复投'+(top.length>1?'，同样优先的还有 '+top.slice(1).map(x=>x.c.name).join('、'):'')+'。':'。'));
  if(weak.length) out.push(weak.map(x=>x.c.name+'（'+Math.round(x.m.idx*100)+'%）').join('、')+' 播放不到平时的 60%，先不复投，可以看看是选题还是发布时间的问题。');
  const withRoi = done.filter(x=>x.m.roi!=null).sort((x,y)=>y.m.roi-x.m.roi);
  if(withRoi.length) out.push('带货 ROI 最高的是 '+withRoi[0].c.name+'（'+withRoi[0].m.roi.toFixed(2)+'），下一轮可以把这类达人的合作方式改成固定费 + 佣金。');
  out.push('结果写回达人档案后，下次匹配会按历史表现调整排序。');
  return out.map((x,i)=>(i+1)+'. '+x).join('\n');
}

function withHistory(c, r){
  const h = PERF_CACHE && PERF_CACHE[c.id];
  if(!h || !h.runs || !h.runs.length) return r;
  const last = h.runs[h.runs.length-1];
  const adj = last.rating==='优先复投' ? 8 : last.rating==='不建议复投' ? -12 : 2;
  return Object.assign({}, r, {score:clamp(r.score+adj,0,100),
    reason:r.reason+'；合作过 '+h.runs.length+' 次，上次播放达预期 '+Math.round(last.idx*100)+'%、CPM '+usd2(last.cpm),
    risks:[{lv:last.rating==='不建议复投'?'warn':'good', t:'历史合作：'+last.rating}].concat(r.risks)});
}
let PERF_CACHE = null;
function histJson(id){
  const h = PERF_CACHE && PERF_CACHE[id];
  if(!h || !h.runs || !h.runs.length) return {};
  const last = h.runs[h.runs.length-1];
  return {past_campaign:{times:h.runs.length, views_vs_usual_pct:Math.round(last.idx*100), cpm_usd:last.cpm, rating:last.rating}};

function download(name, text){

    a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
    a.download = name; document.body.appendChild(a); a.click();

}

/* --- deal actions --- */
function setPath(o, path, v){ const k = path.split('.'); let t = o; for(let i=0;i<k.length-1;i++) t = t[k[i]]; t[k[k.length-1]] = v; }
function dealAction(id, act){
  const c = BY_ID[id], d = S.deals[id]; if(!c || !d) return;
  switch(act){
    case 'sample': { const pr = sampleReplyPair(c, Object.keys(S.deals).indexOf(id)); d.reply = pr[0]; d.replyZh = zhPack(pr[1], pr[0]); render(); break; }
    case 'parse': doParseReply(id); break;
    case 'counter': doCounter(id); break;
    case 'sendCounter': d.counterSent = true; d.sentOffer = +d.offer||0; logPush(d, '我方', d.parsed && d.parsed.ask && d.sentOffer>=d.parsed.ask ? '接受报价' : (d.sug && d.sug.kind==='final' ? '最终报价' : '还价'), d.model==='commission' ? null : d.sentOffer, d.model); toast('已模拟发送给 '+c.first); render(); break;
    case 'reply2': d.round = (d.round||1) + 1; d.awaitReply = true; d.reply = ''; d.replyZh = null; d.counter = null; d.counterSent = false; d.counterOk = false; render(); break;
    case 'again': d.agreed = false; d.counterSent = false; d.counterOk = false; d.termsOk = false; render(); break;
    case 'agree': d.agreed = true; d.termsOk = false; logPush(d, '达人', d.parsed && d.parsed.ask && d.sentOffer>=d.parsed.ask ? '确认成交' : '接受', d.sentOffer!=null ? d.sentOffer : d.offer, d.model); render(); break;
    case 'lost': d.stage = 'lost'; toast(c.name+' 已标记为未合作'); render(); break;
    case 'sign': d.final = Math.max(0, +d.offer||0); d.stage = 'signed'; d.signedAt = Date.now(); logPush(d, '双方', '签约', d.final, d.model); saveNeg(c, d); toast('已签约 '+c.name+'（模拟），下一步写拍摄要点、寄样'); render(); break;
    case 'brief': doBrief(id); break;
    case 'track': d.ship.no = (d.ship.carrier==='USPS'?'9400':'JD')+String(1e9+hashStr(id)%9e9).slice(0,10); render(); break;
    case 'ship': d.stage = 'shipped'; toast('已模拟寄出样品，并把拍摄要点发给 '+c.first); render(); break;
    case 'submitted': d.stage = 'review'; S.max = Math.max(S.max, 7); toast(c.first+' 交稿了'); go(7); break;
    case 'draftBad': d.draft = sampleDraft(c, false); d.draftZh = zhPack(sampleDraftZh(c, false), d.draft); d.review = null; render(); break;
    case 'draftGood': d.draft = sampleDraft(c, true); d.draftZh = zhPack(sampleDraftZh(c, true), d.draft); d.review = null; render(); break;
    case 'review': doReview(id); break;
    case 'reject': d.feedback = feedbackMail(c, d); d.feedbackZh = zhPack(feedbackMailZh(c, d), d.feedback); d.feedbackOpen = true; render(); break;
    case 'cancelFb': d.feedbackOpen = false; render(); break;
    case 'sendFb': d.rounds += 1; d.feedbackOpen = false; d.review = null; toast('修改意见已发给 '+c.first+'（模拟），等对方交第 '+(d.rounds+1)+' 稿'); render(); break;
    case 'approve': d.stage = 'approved'; S.max = Math.max(S.max, 8); toast(c.name+' 的稿件已通过，可以发布'); render(); break;
    case 'fetch': doFetchVideo(id); break;
    case 'sampleVideo': d.video = sampleVideo(c); d.videoErr = ''; if(d.stage==='approved') d.stage = 'live'; render(); break;
    case 'sampleSales': sampleSales(c, d); render(); break;
  }
}

// The creator's sample replies, English and Chinese built side by side from the same case.
function sampleReplyPair(c, i){
  const s = S.sender, prod = prodEn(), pz = prodZh(), dl = S.deals[c.id];
  const hi = 'Hi '+s.name+',\n\n', hz = '嗨 '+s.name+'，\n\n';
  if(dl && dl.round>1){
    const prev = (dl.parsed && dl.parsed.ask) || r10(c.price.hi*1.2), sent = dl.sentOffer || c.price.hi;
    const hyb = dl.model==='hybrid';
    if(dl.round>=3){ const x = r10(prev*.95);
      return [hi+'I really like the product. $'+x+(hyb?' as the fixed fee, plus the commission,':'')+' is the lowest I can go for a dedicated video.\n\n'+c.first,
              hz+'我真的很喜欢这个产品。'+(hyb?'固定费 $'+x+' 再加佣金':'$'+x)+'，是我做一条专门视频的最低价了。\n\n'+c.first]; }
    const mid = r10((prev+sent)/2);

const ZH = {
  mail: id => { const m = S.emails[id]; return m && {en:m.body, zh:m.zh || autoZh('mail', id), set:z=>{ m.zh = z; }}; },
  reply: id => { const d = S.deals[id]; return d && {en:d.reply, zh:d.replyZh || autoZh('reply', id), set:z=>{ d.replyZh = z; }}; },
  counter: id => { const d = S.deals[id]; return d && d.counter && {en:d.counter.body, zh:d.counter.zh || autoZh('counter', id), set:z=>{ d.counter.zh = z; }}; },
  brief: id => { const d = S.deals[id]; return d && {en:d.brief, zh:d.briefZh || autoZh('brief', id), set:z=>{ d.briefZh = z; }}; },
  feedback: id => { const d = S.deals[id]; return d && {en:d.feedback, zh:d.feedbackZh || autoZh('feedback', id), set:z=>{ d.feedbackZh = z; }}; },
  draft: id => { const d = S.deals[id]; return d && {en:d.draft, zh:d.draftZh || autoZh('draft', id), set:z=>{ d.draftZh = z; }}; }
};
// Text saved before translations existed (or before a template was reworded) has no Chinese
// stored with it. When it is exactly what one of the demo's templates writes, the matching
// Chinese is rebuilt, so old progress gets translations too. Pasted or edited text does not.
function legacyDraft(c){
  const s = S.sender, prod = prodEn(), pts = S.rc.points.filter(Boolean), comp = competitors(c)[0] || 'my old one';
  return ['Okay, I\'ve tested a LOT of these and this is the best '+prod+' ever made.\n\n'

    +s.brand+' 的'+prodZh()+'：'+(pts[0]?(PT_ZH[pts[0]]||pts[0]):'很棒')+'。说实话，它比我以前那个 '+(competitors(c)[0]||'')+' 好 100%，而且能用一辈子。\n\n'
    +'用我下面的链接入手吧 👇'];
}
function autoZh(kind, id){
  const c = BY_ID[id], d = S.deals[id];
  if(!c || !S.brief) return null;
  try {
    if(kind==='mail'){ const m = S.emails[id], t = templateMail(c); if(m && m.body===t.body) return zhPack(templateMailZh(c), t.body); }
    if(!d) return null;
    if(kind==='reply'){ const pr = sampleReplyPair(c, Object.keys(S.deals).indexOf(id)); if(d.reply===pr[0]) return zhPack(pr[1], pr[0]); }
    if(kind==='counter' && d.counter){ const t = templateCounter(c, d); if(d.counter.body===t.body) return zhPack(templateCounterZh(c, d), t.body); }
    if(kind==='brief' && S.rc){ const t = templateBrief(c, d); if(d.brief===t) return zhPack(templateBriefZh(c, d), t); }
    if(kind==='feedback'){ const t = feedbackMail(c, d); if(d.feedback===t) return zhPack(feedbackMailZh(c, d), t); }
    if(kind==='draft' && S.rc){
      for(const f of [false, true]){ const t = sampleDraft(c, f); if(d.draft===t) return zhPack(sampleDraftZh(c, f), t); }
      const lg = legacyDraft(c); if(d.draft===lg[0]) return zhPack(lg[1], lg[0]);
    }
  } catch(e){}
  return null;
}
const ZH_NOTE = {mail:'仅供演示，不会发给达人', counter:'仅供演示，不会发给达人', brief:'仅供演示，不会发给达人', feedback:'仅供演示，不会发给达人', reply:'达人原文的意思', draft:'稿件的意思'};
function zhBox(kind, id){
  const a = ZH[kind](id);
  if(!a || !String(a.en||'').trim()) return '';
  const busy = S.busy==='tr:'+kind+':'+id, ai = S.mode==='ai';
  const btn = ai ? '<button type="button" class="btn sm" data-tr="'+kind+':'+id+'"'+(S.busy?' disabled':'')+'>'+(busy?'翻译中…':(a.zh?'重新翻译':'翻译成中文'))+'</button>' : '';
  if(!a.zh) return '<div class="zh zh-none" id="zh-'+kind+'-'+id+'"><div class="zh-h"><b>中文翻译</b><span class="meta">'+(ai?'这段是手动粘贴或改写的，还没有翻译':'这段是手动粘贴的；规则模式只给示例文本配翻译，打开 AI 模式可以一键翻译')+'</span><span class="spacer"></span>'+btn+'</div></div>';
  const stale = a.zh.for !== a.en;

    +'<div class="zh-b">'+esc(a.zh.text)+'</div></div>';
}
function markZhStale(kind, id){
  const box = document.getElementById('zh-'+kind+'-'+id), a = ZH[kind](id);
  if(!box || !a || !a.zh) return;
  const t = box.querySelector('.zh-stale'); if(t) t.hidden = a.zh.for === a.en;
}
async function doTranslate(kind, id){
  const a = ZH[kind](id); if(!a || !a.en) return;
  if(S.mode!=='ai'){ toast('打开 AI 模式才能翻译手动输入的文字'); return; }
  const en = a.en;
  S.busy = 'tr:'+kind+':'+id; render();
  const j = await aiJson('把下面的英文翻译成自然的中文。保留换行、金额和 #ad 之类的标签，人名、品牌名和频道名不翻译。只返回 JSON：{"zh":"译文"}\n\n'+en);
  S.busy = '';
  const t = typeof j==='string' ? j : (j && (j.zh || j.text));
  if(t) a.set(zhPack(String(t).slice(0,4000), en)); else toast('这次没拿到翻译，请再试一次');
  render();
}

/* ---------- save / restore demo progress (per browser) ---------- */
const SAVE_KEY = 'influencer_demo_state_v1';
let saveTimer = null;
function persistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
function slimCreator(c){
  const o = Object.assign({}, c);
  o.desc = String(c.desc||'').slice(0, 600);
  delete o.cmts;
  o.recent = (c.recent||[]).map(v=>({id:v.id, title:v.title, at:v.at, s:v.s, dur:v.dur, spon:v.spon, aff:v.aff, cat:v.cat, lang:v.lang, brands:v.brands}));
  return o;
}
function persist(){
  if(S.busy || CREATOR_MODE) return;
  try {
    const keep = new Set(S.pool.map(c=>c.id).concat(S.results.map(x=>x.id)));
    const real = Object.keys(BY_ID).map(id=>BY_ID[id]).filter(c=>c.real && keep.has(c.id));
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:1, savedAt:Date.now(), step:S.step, max:S.max, mode:S.mode, source:S.source, input:S.input,
      brief:S.brief, briefSrc:S.briefSrc, notes:S.notes, questions:S.questions,
      poolIds:S.pool.map(c=>c.id), relax:S.relax, results:S.results, rankSrc:S.rankSrc,
      selected:Array.from(S.selected), lookalikeIds:Array.from(S.lookalikeIds),
      sender:S.sender, emails:S.emails, mailSrc:S.mailSrc, checked:Array.from(S.checked), deals:S.deals, rc:S.rc, report:S.report,
      t0:S.t0, tSend:S.tSend, realStats:S.realStats, trending:S.trending, auth:S.auth, real:real.map(slimCreator)
    }));
  } catch(e){}
}
function migrateBoard(board){
  const out = {};
  Object.keys(board||{}).forEach(id=>{ const c = BY_ID[id]; if(c){ out[id] = newDeal(c); if(board[id]==='replied') out[id].reply = ''; } });
  return out;
}
function restore(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(!d || d.v!==1) return false;
    if(d.source==='youtube' && IN_ARTIFACT) return false;
    (d.real||[]).forEach(c=>{ BY_ID[c.id] = c; });
    Object.assign(S, {
      step:d.step||1, max:d.max||1, source:d.source||'sample', input:d.input||S.input,
      brief:d.brief||null, briefSrc:d.briefSrc||'', notes:d.notes||[], questions:d.questions||[],
      pool:(d.poolIds||[]).map(id=>BY_ID[id]).filter(Boolean), relax:d.relax||[],
      results:(d.results||[]).filter(x=>BY_ID[x.id]), rankSrc:d.rankSrc||'',
      selected:new Set((d.selected||[]).filter(id=>BY_ID[id])), lookalikeIds:new Set(d.lookalikeIds||[]),
      sender:d.sender||S.sender, emails:d.emails||{}, mailSrc:d.mailSrc||'', checked:new Set(d.checked||[]),
      deals:d.deals||migrateBoard(d.board), rc:d.rc||null, report:d.report||null, t0:d.t0||null, tSend:d.tSend||null, realStats:d.realStats||null, trending:d.trending||null, auth:d.auth||{},
      savedMode:d.mode
    });
    if(!S.brief){ S.step = 1; S.max = 1; }
    return S.step>1;
  } catch(e){ return false; }
}

  if(d.sel){ if(t.checked) S.selected.add(d.sel); else S.selected.delete(d.sel); render(); return; }

  if(d.da){ const i = d.da.indexOf(':'); dealAction(d.da.slice(0,i), d.da.slice(i+1)); return; }

  if(d.dterms){ const x = S.deals[d.dterms]; if(x){ x.termsOk = t.checked; render(); } return; }
  if(d.jump){ const x = S.deals[d.jump]; if(!x) return; const st = x.stage==='review' ? 7 : ['approved','live','done'].indexOf(x.stage)>=0 ? 8 : 6; if(S.step!==st) go(st); setTimeout(()=>{ const el = document.getElementById('deal-'+d.jump); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60); return; }
  if(d.authgo){

    authFlow(id, step, plat, flag==='deny' ? '你选择了拒绝，没有读取任何数据。可以稍后再授权。' : '');

  }

  if(d.copy){ const v = d.copy; try { navigator.clipboard.writeText(v).then(()=>toast('已复制'), ()=>toast('复制失败，请手动选中复制')); } catch(e){ toast('复制失败，请手动选中复制'); } return; }
  switch(d.act){
    case 'close': closeDrawer(); break;
    case 'saveKey': { const k = $('#yt-key').value.trim(); if(!k){ toast('先粘贴 API Key'); break; } S.ytKey = k; saveKey(k); toast('Key 已保存在这台电脑的浏览器里'); render(); break; }
    case 'clearKey': S.ytKey=''; saveKey(''); toast('Key 已清除'); render(); break;
    case 'saveDs': { const k = $('#ds-key').value.trim(); if(!k){ toast('先粘贴 DeepSeek API Key'); break; } S.dsKey = k; saveDsKey(k); S.aiAvailable = true; S.mode = 'ai'; S.dsStatus = null; toast('DeepSeek Key 已保存，建议点“测试连接”确认一下'); render(); break; }
    case 'testDs': {
      const k = $('#ds-key').value.trim(); if(!k){ toast('先粘贴 DeepSeek API Key'); break; }
      S.dsKey = k; saveDsKey(k); S.dsStatus = {lv:'neutral', t:'正在测试…'}; render();
      dsPing().then(st => { S.dsStatus = st; if(st.lv==='good'){ S.aiAvailable = true; S.mode = 'ai'; } else { S.aiAvailable = false; S.mode = 'rule'; } render(); });
      break;
    }
    case 'clearDs': S.dsKey=''; S.dsStatus=null; saveDsKey(''); if(!IN_ARTIFACT){ S.aiAvailable=false; S.mode='rule'; } toast('DeepSeek Key 已清除'); render(); break;
    case 'parse': doParse(); break;
    case 'match': doMatch(); break;
    case 'rerank': S.step=2; doMatch(true); break;
    case 'toReview': S.max=Math.max(S.max,4); go(4); break;
    case 'toMail': S.max=Math.max(S.max,5); go(5); break;
    case 'genMail': doGenMail(); break;
    case 'send': doSend(); break;
    case 'report': doReport(); break;
    case 'copyReport': try { navigator.clipboard.writeText(S.report.text).then(()=>toast('已复制'), ()=>toast('复制失败，请手动选中复制')); } catch(e){ toast('复制失败，请手动选中复制'); } break;
    case 'dlReport': download('达人营销复盘.txt', S.report.text); break;
    case 'writeBack': doWriteBack(); break;
    case 'clearPerf': if(confirm('清空私有达人库里的合作记录和谈判记录？')){ savePerf({}); try { localStorage.removeItem(NEG_KEY); } catch(e){} render(); } break;
    case 'restart': Object.assign(S,{step:1,max:1,brief:null,results:[],pool:[],selected:new Set(),emails:{},checked:new Set(),deals:{},rc:null,report:null,t0:null,tSend:null,ytError:'',realStats:null,trending:null,auth:{}}); render(); break;
  }
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if(e.target.id==='need') S.input = e.target.value;
  if(d.subj && S.emails[d.subj]) S.emails[d.subj].subject = e.target.value;
  if(d.body && S.emails[d.body]){
    S.emails[d.body].body = e.target.value;
    markZhStale('mail', d.body);
    const box = document.getElementById('chk-'+d.body);
    if(box) box.innerHTML = checkTags(numberCheck(BY_ID[d.body], e.target.value));
    if(S.checked.has(d.body)){ S.checked.delete(d.body); const cb=document.querySelector('[data-check="'+d.body+'"]'); if(cb) cb.checked=false; const sb=$('#send-btn'); if(sb) sb.disabled=true; }
  }
  if(e.target.id==='s-brand') S.sender.brand = e.target.value;
  if(e.target.id==='s-name') S.sender.name = e.target.value;
  if(e.target.id==='s-prod') S.sender.productEn = e.target.value;
  if(d.df){
    const i = d.df.indexOf(':'), id = d.df.slice(0,i), path = d.df.slice(i+1), x = S.deals[id];
    if(!x) return;
    const num = e.target.type==='number';
    setPath(x, path, num ? (e.target.value==='' ? '' : +e.target.value) : e.target.value);
    if(path==='model'){ render(); return; }
    if(path==='counter.body' || path==='counter.subject'){
      const box = document.getElementById('dchk-'+id); if(box) box.innerHTML = checkTags(dealNumberCheck(BY_ID[id], x, x.counter.body));
      if(x.counterOk && !x.counterSent){ x.counterOk = false; const cb = document.querySelector('[data-dcheck="'+id+'"]'); if(cb) cb.checked = false; const sb = document.querySelector('[data-da="'+id+':sendCounter"]'); if(sb) sb.disabled = true; }
    }
    const ZK = {reply:'reply', 'counter.body':'counter', brief:'brief', feedback:'feedback', draft:'draft'}[path]; if(ZK) markZhStale(ZK, id);
    if(path==='ship.no'){ const sb = document.querySelector('[data-da="'+id+':ship"]'); if(sb) sb.disabled = !(x.brief && x.ship.no.trim()); }
    if(path==='draft' && x.review){ const st = document.querySelector('#deal-'+id+' [data-da="'+id+':approve"]'); if(st) st.disabled = x.review.text!==x.draft; }
    persistSoon();
  }
  if(d.rc){ if(!S.rc) S.rc = defaultRC(); S.rc[d.rc] = e.target.value.split('\n').map(x=>x.trim()).filter(Boolean); persistSoon(); }
  if(d.report && S.report){ S.report.text = e.target.value; persistSoon(); }
});
// Guardrail tips are fixed-position and placed next to their chip, kept inside the window.
function placeTip(g){
  const tip = g.querySelector('.tipbox'); if(!tip) return;
  const r = g.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, pad = 12;
  const left = clamp(r.left, pad, Math.max(pad, innerWidth - w - pad));
  const below = r.bottom + 8 + h <= innerHeight - pad || r.top - 8 - h < pad;
  tip.classList.toggle('up', !below);
  tip.style.left = left+'px';
  tip.style.top = (below ? r.bottom + 8 : r.top - 8 - h)+'px';
}
document.addEventListener('mouseover', e => { const g = e.target.closest && e.target.closest('.guard'); if(g && !e.target.closest('.tipbox')) placeTip(g); });
document.addEventListener('focusin', e => { const g = e.target.closest && e.target.closest('.guard'); if(g) placeTip(g); });
document.addEventListener('scroll', () => { const g = document.querySelector('.guard:hover, .guard:focus'); if(g) placeTip(g); }, true);
// Our offer is drawn on the price bar; redraw once the number is settled.
document.addEventListener('change', e => { const df = e.target.dataset && e.target.dataset.df; if(df && /:offer$/.test(df)) render(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#drawer').hidden) closeDrawer(); });

/* ---------- creator-facing invite page (opened from the invite link) ---------- */
const AUTH_QS = new URLSearchParams(location.search);
const CREATOR_MODE = !IN_ARTIFACT && AUTH_QS.get('authorize')==='1';
const INBOX_KEY = 'influencer_demo_auth_inbox';
function creatorLink(c){
  const base = location.href.split('#')[0].split('?')[0];
  const q = new URLSearchParams({authorize:'1', c:c.id, n:c.name, h:c.handle, p:c.platform});
  return base + '?' + q.toString();
}
function pushInbox(item){
  try { const a = JSON.parse(localStorage.getItem(INBOX_KEY) || '[]'); a.push(item); localStorage.setItem(INBOX_KEY, JSON.stringify(a)); } catch(e){}
}
function drainInbox(){
  let a = [];
  try { a = JSON.parse(localStorage.getItem(INBOX_KEY) || '[]'); } catch(e){ return; }
  if(!a.length) return;
  const keep = [], done = [];
  a.forEach(it => {
    const c = BY_ID[it.id];
    if(!c){ keep.push(it); return; }
    if(it.action==='revoke'){ delete S.auth[it.id]; }
    else { S.auth[it.id] = makeAuthData(c, it.platform); }
    refreshResult(it.id); done.push(c.name + (it.action==='revoke' ? ' 取消了授权' : ' 完成了 '+it.platform+' 授权'));
  });
  try { localStorage.setItem(INBOX_KEY, JSON.stringify(keep)); } catch(e){}
  if(done.length){ render(); toast('达人端更新：' + done.join('；')); }
}

      +(note ? '<div class="callout ask">'+esc(note)+'</div>' : '')

  } else if(step==='consent'){

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cp]'); if(!t || !CREATOR_MODE) return;
  const [step, plat, flag] = t.dataset.cp.split(':');
  const id = AUTH_QS.get('c') || '';

});
window.addEventListener('storage', e => { if(e.key===INBOX_KEY && !CREATOR_MODE) drainInbox(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !CREATOR_MODE) drainInbox(); });

else drainInbox();
if(restored) toast('已恢复上次的演示进度。想从头开始，点左下角“重新开始”。');
