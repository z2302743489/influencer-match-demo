<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>出海达人匹配助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: operator console. Left rail = the 5-step pipeline, right = the working step. */
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#142030; --muted:#5A6778; --line:#DAE0E8; --chip:#ECEFF4;
  --accent:#DD5418; --accent-ink:#FFFFFF; --accent-soft:#FCE9DF;
  --good:#1D7F55; --good-soft:#E1F3EA; --warn:#A86C12; --warn-soft:#FAEFD8; --bad:#BE3429; --bad-soft:#FBE4E1;
  --focus:#2B6CDF; --shadow:0 1px 2px rgba(20,32,48,.06),0 4px 16px rgba(20,32,48,.06);
  --display:'Space Grotesk','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --body:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D131A; --panel:#151D27; --ink:#E5EBF2; --muted:#93A0AF; --line:#26313E; --chip:#1D2733;
  --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:#3A2116;
  --good:#4CC38A; --good-soft:#14301F; --warn:#E2B04B; --warn-soft:#33280F; --bad:#F0736A; --bad-soft:#3A1A18;
  --focus:#6EA0FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D131A; --panel:#151D27; --ink:#E5EBF2; --muted:#93A0AF; --line:#26313E; --chip:#1D2733;
  --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:#3A2116;
  --good:#4CC38A; --good-soft:#14301F; --warn:#E2B04B; --warn-soft:#33280F; --bad:#F0736A; --bad-soft:#3A1A18;
  --focus:#6EA0FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
h1{font-family:var(--display);font-size:19px;margin:0;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--muted);font-size:12.5px}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.demo-tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-top:22px}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.step-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.step-btn .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
.step-btn[aria-current="step"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.step-btn[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-btn.done .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step-btn:disabled{opacity:.45;cursor:default}
.hand{font-size:10.5px;color:var(--accent);font-weight:600;margin-left:auto;white-space:nowrap}
.rail-note{margin-top:18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.rail-note b{color:var(--ink);font-weight:600}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.steps ol{flex-direction:row;flex-wrap:wrap;position:static}
  .step-btn{width:auto;padding:6px 8px}
  .step-btn .lbl{display:none}
  .step-btn[aria-current="step"] .lbl{display:inline}
  .hand,.rail-note{display:none}
}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-size:15px;margin:0}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
.takeover{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.why{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px;max-width:80ch}
.why b{color:var(--ink);font-weight:600}

.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--chip);padding:4px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.static{cursor:default}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.neutral{background:var(--chip);color:var(--muted)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}

textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid2 .full{grid-column:1/-1}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.callout{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-size:13px}
.callout.ask{border-color:var(--warn);background:var(--warn-soft)}
.callout.ask b{color:var(--warn)}
.callout ul{margin:6px 0 0;padding-left:18px}

.funnel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.funnel .stage{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.funnel .stage b{font-family:var(--mono);font-size:14px}
.funnel .arr{color:var(--muted)}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:24px 30px minmax(0,1fr) 150px auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.item:first-child{border-top:0}
.item.sel{background:var(--accent-soft)}
.rank{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.who{display:flex;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.who-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.who-name{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.handle{color:var(--muted);font-weight:400;font-size:12.5px}
.meta{font-size:12.5px;color:var(--muted)}
.reason{font-size:13px;color:var(--ink)}
.risks{display:flex;flex-wrap:wrap;gap:4px}
.score{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.score b{font-family:var(--mono);font-size:16px;color:var(--ink)}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
@media (max-width:760px){
  .item{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"c w a" "c s s"}
  .item .rank{display:none}
  .item>input{grid-area:c}
  .item .who{grid-area:w}
  .item .score{grid-area:s}
  .item .act{grid-area:a}
}

.budget{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1;max-width:420px;font-size:12.5px;color:var(--muted)}
.sticky-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);z-index:5}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.aud{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.aud-row{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;gap:8px;align-items:center}
.aud-row .bar{height:8px}
.aud-row.hit .bar i{background:var(--good)}
.aud-row em{font-style:normal;font-family:var(--mono);text-align:right;font-size:12px}
.posts{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.posts li{margin:2px 0}
.lbl-s{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.mail{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.mail-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mail-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mail-body textarea{min-height:220px;font-size:13px;background:var(--bg)}
.mail-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.mail-foot label{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;font-size:14px}
.col h3 span{font-family:var(--mono);color:var(--muted)}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.stat span{font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat small{color:var(--muted);font-size:12px}

#drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(10,16,24,.45)}
#drawer .sheet{width:min(560px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
.x{margin-left:auto;border:0;background:var(--chip);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:min(560px,calc(100% - 32px))}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
a.ext{color:var(--focus);text-decoration:none}
.wt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wt-row{display:grid;grid-template-columns:92px 118px 62px minmax(0,1fr);gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px}
.wt-row:first-child{border-top:0}
.wt-row em{font-style:normal;color:var(--muted);font-size:12px}
@media (max-width:620px){.wt-row{grid-template-columns:minmax(0,1fr) auto auto}.wt-row em{grid-column:1/-1}}
a.ext:hover{text-decoration:underline}
.posts a{color:var(--ink)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--bg)" stroke-width="1.6" opacity=".55"/><circle cx="12" cy="12" r="5" stroke="var(--bg)" stroke-width="1.6" opacity=".8"/><path d="M12 12 L19 6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="16.5" cy="8.2" r="1.8" fill="var(--accent)"/></svg>
      </div>
      <div>
        <h1>出海达人匹配助手</h1>
        <div class="sub">从一句话需求到第一封邀约：需求解析 → 匹配排序 → 审核 → 邀约 → 看板 · <span class="num">版本 11-22 · DeepSeek</span></div>
      </div>
    </div>
    <div class="top-right">
      <span class="demo-tag" id="demo-tag">示例数据 · 达人与品牌均为虚构</span>
      <div class="seg" role="group" aria-label="数据来源">
        <button id="src-sample" type="button" aria-pressed="true">示例数据</button>
        <button id="src-yt" type="button" aria-pressed="false">YouTube 实时</button>
      </div>
      <div class="seg" role="group" aria-label="运行模式">
        <button id="mode-ai" type="button" aria-pressed="false" disabled title="在 claude.ai 中打开时可用">AI 模式</button>
        <button id="mode-rule" type="button" aria-pressed="true">规则模式</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" aria-label="流程">
      <ol id="steps"></ol>
      <div class="rail-note"><b>人工接管点</b><br>需求确认、达人选择、邀约发送三处必须由人点头。AI 只做理解、排序和起草。</div>
      <div class="rail-note">进度会自动保存，刷新或重新打开页面会回到原来那一步。<br><button type="button" class="btn sm" data-act="restart" style="margin-top:8px">重新开始</button></div>
    </nav>
    <section id="view" aria-live="polite"></section>
  </div>
</div>

<div id="drawer" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="达人详情"></div></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x,y)=>x+y,0);
const fmtK = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+'M' : n>=1e4 ? Math.round(n/1e3)+'K' : n>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const money = n => '$'+Math.round(n).toLocaleString('en-US');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hasKw(t, w){ return /^[a-z0-9 ]+$/i.test(w) ? new RegExp('(^|[^a-z0-9])'+w+'([^a-z0-9]|$)','i').test(t) : t.indexOf(w) >= 0; }
let toastTimer;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true},3200); }

/* ---------- dictionaries ---------- */
const CATS = {
  outdoor:{zh:'户外露营',en:'outdoor gear',kw:['露营','户外','camping','camp','outdoor','徒步','hiking','登山','帐篷','营地','露营灯','lantern','手电','tent']},
  pets:{zh:'宠物',en:'pet product',kw:['宠物','猫','狗','pet','pets','cat','dog','饮水机','猫砂','fountain','狗粮']},
  beauty:{zh:'美妆个护',en:'beauty product',kw:['美妆','护肤','口红','beauty','skincare','makeup','面膜','香水','彩妆','精华','lipstick','防晒','sunscreen']},
  home:{zh:'家居厨房',en:'home gadget',kw:['家居','厨房','收纳','home','kitchen','清洁','空气炸锅','拖把','cleaning']},
  tech:{zh:'3C 数码',en:'tech accessory',kw:['数码','耳机','充电','手机壳','tech','gadget','3c','电子','键盘','投影','earbuds','charger','projector','充电宝']},

function erBench(platform, followers){
  const base = {TikTok:5.2,Instagram:2.6,YouTube:3.4}[platform];
  const k = followers>500000 ? .7 : followers<50000 ? 1.25 : 1;
  return +(base*k).toFixed(1);
}
function priceOf(c){
  const mkt = {SEA:.4,LATAM:.5,ME:.8,JP:.9}[REGION_OF[c.country]] || 1;
  const base = Math.max(150, c.avgViews/1000*CPM[c.platform]*mkt);
  return {lo:Math.round(base*.8/10)*10, hi:Math.round(base*1.25/10)*10};
}
function genCreators(n){

  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const catKeys = Object.keys(CATS), out=[], used=new Set();
  for(let i=0;i<n;i++){

    const country = wpick(CW);

    let avgViews = Math.round(followers*(vf[0]+r()*(vf[1]-vf[0])));

    let fakePct = Math.round(3+r()*12);

    const region = REGION_OF[country];
    const near = shuffle(Object.keys(REGION_OF).filter(k=>k!==country && REGION_OF[k]===region));
    const far = shuffle(['US','UK','CA','AU'].filter(k=>k!==country && near.indexOf(k)<0));
    const others = near.concat(far).slice(0,2);
    const own = 45 + Math.round(r()*35);
    const s2 = Math.round((100-own)*(.35+r()*.25));
    const s3 = Math.round((100-own-s2)*(.4+r()*.3));
    const aud = {}; aud[country]=own; aud[others[0]]=s2; aud[others[1]]=s3;
    const first = pick(FIRST);
    let handle; do { handle = '@'+first.toLowerCase()+'.'+pick(HANDLE_WORD[cat])+(r()<.5?Math.floor(r()*90+10):''); } while(used.has(handle));

      styles:shuffle(Object.keys(STYLES)).slice(0,2), followers, avgViews, er, fakePct, aud,

      responseRate:Math.round(15+r()*55), lastActive: r()<.07 ? Math.round(31+r()*40) : Math.round(r()*9),

    };

    out.push(c);
  }
  return out;
}

/* ---------- scoring ---------- */
function riskOf(c, b){
  if(c.real) return riskReal(c, b);
  const r = [];
  const bench = erBench(c.platform, c.followers);
  if(c.fakePct>=20) r.push({lv:'bad', t:'疑似假粉 '+c.fakePct+'%'});
  if(c.er > bench*2.6) r.push({lv:'bad', t:'互动率异常偏高，疑似刷量'});
  if(c.lastActive>30) r.push({lv:'warn', t:c.lastActive+' 天未更新'});
  if(b && b.budgetUsd && c.price.lo > b.budgetUsd*.6) r.push({lv:'warn', t:'单人报价可能超预算'});
  if(c.brands.length && b && (c.cat===b.category)) r.push({lv:'neutral', t:'合作过同品类：'+c.brands[0]});
  return r;
}
function targetShare(c, b){ return sum(b.countries.map(cc=>c.aud[cc]||0)); }
function scoreOf(c, b){
  if(c.real) return scoreReal(c, b);
  const bench = erBench(c.platform, c.followers);
  const share = targetShare(c, b);
  const fCat = c.cat===b.category ? 1 : c.cat2===b.category ? .6 : 0;
  const fAud = Math.min(share/70, 1);
  const fEr = clamp((c.er/bench)/2, 0, 1);
  const styleHit = c.styles.filter(s=>b.styles.indexOf(s)>=0);
  const fStyle = b.styles.length ? (styleHit.length ? 1 : 0) : .5;
  const fGender = b.gender==='female' ? c.female/100 : b.gender==='male' ? (100-c.female)/100 : .7;
  const fQ = 1 - clamp(c.fakePct/40, 0, 1);
  let s = 35*fCat + 25*fAud + 15*fEr + 10*fStyle + 5*fGender + 10*fQ;
  const risks = riskOf(c, b);
  if(risks.some(x=>x.lv==='bad')) s -= 18;
  if(c.lastActive>30) s -= 8;
  const parts = [];
  if(fCat===1) parts.push('内容以'+CATS[c.cat].zh+'为主');
  else if(fCat>0) parts.push('兼做'+CATS[b.category].zh+'内容');
  if(share>0) parts.push('受众 '+share+'% 在'+b.countries.filter(cc=>c.aud[cc]).map(cc=>COUNTRIES[cc]).join('/'));
  parts.push('互动率 '+c.er+'%（同量级参考 '+bench+'%）');
  if(styleHit.length) parts.push('擅长'+styleHit.map(s=>STYLES[s]).join('、'));
  return {score:clamp(Math.round(s),0,100), reason:parts.join('，'), risks};
}
function hardFilter(b){
  const notes = [];
  let fmin=b.followersMin, fmax=b.followersMax, plats=b.platforms.slice(), minShare=15;
  const run = () => LIB.filter(c => plats.indexOf(c.platform)>=0 && c.followers>=fmin && c.followers<=fmax && targetShare(c,b)>=minShare && c.lastActive<=60);
  let pool = run();
  const catHits = p => p.filter(c=>c.cat===b.category||c.cat2===b.category).length;
  if(catHits(pool) < 5){ fmin=Math.round(fmin/2); fmax=fmax*2; pool=run(); notes.push('同品类达人不足 5 位，粉丝量放宽到 '+fmtK(fmin)+'–'+fmtK(fmax)); }
  if(catHits(pool) < 5 && plats.length<3){ plats=PLATFORMS.slice(); pool=run(); notes.push('仍然不足，平台放宽到 TikTok / Instagram / YouTube'); }
  if(catHits(pool) < 3){ minShare=5; pool=run(); notes.push('仍然不足，目标国家受众占比门槛从 15% 降到 5%'); }
  return {pool, notes};
}
function similar(c, exclude){
  const sim = d => {
    const cat = d.cat===c.cat ? 1 : (d.cat2===c.cat||d.cat===c.cat2) ? .5 : 0;
    const st = d.styles.filter(s=>c.styles.indexOf(s)>=0).length/2;
    const reg = REGION_OF[d.country]===REGION_OF[c.country] ? 1 : 0;
    const size = 1 - clamp(Math.abs(Math.log10(d.followers)-Math.log10(c.followers))/1.5, 0, 1);
    return .4*cat + .2*st + .2*reg + .2*size;
  };
  const base = c.real ? S.pool : LIB;
  return base.filter(d=>d.id!==c.id && !exclude.has(d.id) && (d.real ? d.vps>=.01 : d.fakePct<20) && d.lastActive<=30)
    .map(d=>({d, s:sim(d)})).sort((x,y)=>y.s-x.s).slice(0,5);
}

/* ---------- requirement parsing (rules) ---------- */
function parseRule(text){
  const t = text.toLowerCase();
  const b = {product:'', productEn:'', category:null, countries:[], platforms:[], followersMin:10000, followersMax:500000, budgetUsd:null, styles:[], gender:'any', format:'寄样 + 付费短视频'};
  const notes = [];
  let best=null, bc=0;
  for(const k in CATS){ const c = CATS[k].kw.filter(w=>hasKw(t,w)).length; if(c>bc){ bc=c; best=k; } }
  b.category = best;
  for(const reg in REGIONS) if(t.indexOf(reg)>=0) b.countries.push.apply(b.countries, REGIONS[reg]);
  for(const cc in COUNTRY_KW) if(COUNTRY_KW[cc].some(w=>hasKw(t,w))) b.countries.push(cc);
  b.countries = Array.from(new Set(b.countries));
  if(hasKw(t,'tiktok')||hasKw(t,'tk')||t.indexOf('抖音')>=0) b.platforms.push('TikTok');
  if(hasKw(t,'instagram')||hasKw(t,'ins')||hasKw(t,'ig')) b.platforms.push('Instagram');
  if(hasKw(t,'youtube')||hasKw(t,'yt')||t.indexOf('油管')>=0) b.platforms.push('YouTube');
  if(!b.platforms.length){ b.platforms = PLATFORMS.slice(); notes.push('没说平台，默认三个平台都找'); }
  const unit = u => (u==='万'||u==='w') ? 10000 : (u==='k'||u==='千') ? 1000 : 1;
  const fr = t.match(/(\d+(?:\.\d+)?)\s*(万|w|k|千)?\s*(?:到|-|~|至|—)\s*(\d+(?:\.\d+)?)\s*(万|w|k|千)\s*粉?/);
  if(fr){ b.followersMin = Math.round(parseFloat(fr[1])*unit(fr[2]||fr[4])); b.followersMax = Math.round(parseFloat(fr[3])*unit(fr[4])); }
  else if(/头部|大v|百万粉/.test(t)){ b.followersMin=500000; b.followersMax=5000000; }
  else if(/中腰部|腰部/.test(t)){ b.followersMin=50000; b.followersMax=500000; }
  else if(/中小/.test(t)){ b.followersMin=10000; b.followersMax=300000; }
  else if(/素人|小达人|nano|micro|kol小/.test(t)){ b.followersMin=3000; b.followersMax=100000; }
  else notes.push('没说粉丝量级，默认 1 万–50 万');
  let m = t.match(/\$\s*([\d,]+(?:\.\d+)?)\s*(k)?/) || t.match(/(\d+(?:\.\d+)?)\s*(k|千|万)?\s*(?:美元|美金|刀|usd|dollars?)/);
  if(m){ let v=parseFloat(m[1].replace(/,/g,'')); v*=unit(m[2]); b.budgetUsd=Math.round(v); }
  else { m = t.match(/(\d+(?:\.\d+)?)\s*(千|万|w)?\s*(?:元|块|人民币|rmb)/); if(m){ b.budgetUsd=Math.round(parseFloat(m[1])*unit(m[2])/7.2); notes.push('预算按 1 美元 ≈ 7.2 元换算'); } }
  for(const s in STYLE_KW) if(STYLE_KW[s].some(w=>hasKw(t,w))) b.styles.push(s);
  if(/女性|女生|宝妈|女孩|女士|women|female/.test(t)) b.gender='female';
  else if(/男性|男生|男士|men\b|male/.test(t)) b.gender='male';
  const pm = text.match(/(?:一款|做|卖|推广|推)([^，,。；;！!\s]{2,14}?)(?:的|，|,|。|$)/);
  b.product = pm ? pm[1] : (b.category ? CATS[b.category].zh+'类商品' : '');
  const pe = PRODUCT_EN.find(x=>text.indexOf(x[0])>=0);
  b.productEn = pe ? pe[1] : (b.category ? CATS[b.category].en : 'product');
  b.query = b.productEn;
  const q = [];
  if(!b.category) q.push('主推的是哪类商品？比如露营灯、宠物饮水机。');
  if(!b.countries.length){ b.countries=['US']; q.push('想先打哪个国家？没说的话先按美国匹配。'); }
  if(b.budgetUsd==null) q.push('这一轮达人合作的总预算大概多少？');
  if(!b.category) b.category='outdoor';
  return {b, notes, questions:q.slice(0,2)};
}

function parseLooseJson(t){
  t = String(t||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try { return JSON.parse(t); } catch(e){}
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(a>=0 && b>a){ try { return JSON.parse(t.slice(a, b+1)); } catch(e){} }
  return null;
}
async function dsJson(prompt){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 90000);
  let res;
  try {
    res = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST', signal:ctl.signal,
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+S.dsKey},
      body: JSON.stringify({
        model:'deepseek-chat', temperature:0.3, max_tokens:4000,
        response_format:{type:'json_object'},
        messages:[
          {role:'system', content:'你是出海品牌的达人营销助手。只输出一个 JSON 对象，格式为 {"result": ...}，result 里放用户要求的 JSON（对象或数组），不要输出任何其他文字。'},
          {role:'user', content:prompt}
        ]
      })
    });
  } catch(e){
    clearTimeout(timer);
    throw {code: e && e.name==='AbortError' ? 'timeout' : 'network'};
  }
  clearTimeout(timer);
  let j = {};
  try { j = await res.json(); } catch(e){}
  if(!res.ok) throw {code:'http_'+res.status, message:(j.error && j.error.message) || ''};
  const content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  const obj = parseLooseJson(content);
  if(obj==null) throw {code:'invalid_json'};

function relKw(b){

  const k = (CATS[b.category]||{kw:[]}).kw.filter(w=>/^[a-z ]+$/.test(w) && w.length>=4);

function langShare(c, b){

  const valid = c.commentN - (c.commentLangs.other||0);
  if(valid<5) return null;
  const tl = new Set(b.countries.map(x=>LANG_OF[x]).filter(Boolean));

function riskReal(c, b){

  if(w && w.level==='高') r.push({lv:'bad', t:'粉丝水分风险高：'+w.top});
  else if(w && w.level==='中') r.push({lv:'warn', t:'粉丝水分风险中：'+w.top});
  if(c.lastActive>30) r.push({lv:'warn', t:c.lastActive+' 天未更新'});
  if(!c.country) r.push({lv:'neutral', t:'频道未公开国家'});
  else if(b && b.countries.indexOf(c.country)<0) r.push({lv:'warn', t:'频道国家不在目标市场'});

  if(b && b.budgetUsd && c.price.lo > b.budgetUsd*.6) r.push({lv:'warn', t:'单人报价可能超预算'});
  if(c.sponCount>=6) r.push({lv:'warn', t:'近 10 条有 '+c.sponCount+' 条商单，广告密度高'});
  if(c.madeForKids) r.push({lv:'warn', t:'面向儿童的频道，评论和个性化广告受限'});
  if(c.commentsOff) r.push({lv:'neutral', t:'评论区关闭或没有评论'});

function scoreReal(c, b){
  const bench = ytBench(c.followers);
  const kws = relKw(b);
  c.relRecent = (c.recent||[]).filter(v=>{ const t = v.title.toLowerCase(); return kws.some(w=>t.indexOf(w)>=0); }).length;
  const chText = (c.desc+' '+(c.keywords||[]).join(' ')+' '+(c.topics||[]).join(' ')).toLowerCase();
  c.chRel = kws.some(w=>chText.indexOf(w)>=0);
  const fRel = Math.min((c.hit.n + c.relRecent + (c.chRel?1:0))/4, 1);
  const cFit = !c.country ? null : (b.countries.indexOf(c.country)>=0 ? 1 : 0);
  const lFit = langShare(c, b);
  const fAud = cFit==null && lFit==null ? .5 : cFit==null ? lFit : lFit==null ? cFit : (cFit+lFit)/2;
  const fEr = c.er ? clamp((c.er/bench)/2, 0, 1) : .3;
  const styleHit = c.styles.filter(s=>b.styles.indexOf(s)>=0);
  const fStyle = b.styles.length ? (styleHit.length ? 1 : 0) : .5;
  const fAct = .6*(c.lastActive<=14 ? 1 : c.lastActive<=30 ? .6 : .2) + .4*clamp(c.perWeek, 0, 1);
  const fReach = clamp(c.vps/.15, 0, 1);
  let s = 30*fRel + 20*fAud + 15*fEr + 15*fReach + 10*fStyle + 10*fAct;
  const risks = riskReal(c, b);
  if(risks.some(x=>x.lv==='bad')) s -= 18;
  if(c.sponCount>=6) s -= 5;
  if(c.water && c.water.level==='中') s -= 6;
  const t0 = c.hit.titles[0] || '';
  const parts = ['搜索命中 '+c.hit.n+' 条、最近 10 条里 '+c.relRecent+' 条相关，如“'+(t0.length>30?t0.slice(0,30)+'…':t0)+'”'];
  parts.push('近 10 条平均播放 '+fmtK(c.avgViews)+'（订阅的 '+Math.round(c.vps*100)+'%）');
  parts.push('互动率 '+c.er+'%（参考 '+bench+'%）');
  if(lFit!=null) parts.push('评论 '+Math.round(lFit*100)+'% 用'+targetLangNames(b));
  parts.push(c.country ? '频道国家：'+ctry(c) : '频道未公开国家');
  if(c.brands.length) parts.push('合作过 '+c.brands.slice(0,2).join('、'));
  if(styleHit.length) parts.push('常做'+styleHit.map(x=>STYLES[x]).join('、'));
  return {score:clamp(Math.round(s),0,100), reason:parts.join('，'), risks};
}

      +'需求：'+S.input;
    const j = await aiJson(prompt);
    S.busy='';
    if(j && typeof j==='object'){
      const okCat = Object.prototype.hasOwnProperty.call(CATS, j.category);
      const cs = Array.isArray(j.countries) ? j.countries.filter(c=>COUNTRIES[c]) : [];
      const ps = Array.isArray(j.platforms) ? j.platforms.filter(p=>PLATFORMS.indexOf(p)>=0) : [];
      const st = Array.isArray(j.styles) ? j.styles.filter(s=>STYLES[s]) : [];
      const fmin = parseInt(j.followers_min,10), fmax = parseInt(j.followers_max,10), bud = parseInt(j.budget_usd,10);
      b = {
        product: String(j.product||b.product).slice(0,30), productEn: String(j.product_en||b.productEn).slice(0,40),
        category: okCat ? j.category : b.category, countries: cs.length ? cs : b.countries, platforms: ps.length ? ps : b.platforms,
        followersMin: fmin>0 ? fmin : b.followersMin, followersMax: fmax>fmin ? fmax : b.followersMax,
        budgetUsd: bud>0 ? bud : b.budgetUsd, styles: st, gender: ['female','male','any'].indexOf(j.gender)>=0 ? j.gender : b.gender,
        format: String(j.format||b.format).slice(0,20), query: String(j.product_en||b.query).slice(0,60)
      };
      notes = Array.isArray(j.notes) ? j.notes.map(String).slice(0,3) : [];
      questions = Array.isArray(j.questions) ? j.questions.map(String).slice(0,2) : [];
      src='ai';
    }
  }
  S.brief=b; S.notes=notes; S.questions=questions; S.briefSrc=src;
  S.sender.productEn = b.productEn;
  S.results=[]; S.selected=new Set(); S.emails={}; S.checked=new Set(); S.board={}; S.tSend=null; S.max=2;
  go(2);
}

function readBrief(){
  const b = S.brief;
  b.product = $('#f-product').value.trim();
  b.category = $('#f-cat').value;
  b.followersMin = Math.max(0, parseInt($('#f-fmin').value,10)||0);
  b.followersMax = Math.max(b.followersMin+1000, parseInt($('#f-fmax').value,10)||500000);
  const bv = parseInt($('#f-budget').value,10); b.budgetUsd = bv>0 ? bv : null;
  b.gender = $('#f-gender').value;
  b.format = $('#f-format').value.trim() || '寄样 + 付费短视频';
  const grp = g => Array.from(document.querySelectorAll('[data-group="'+g+'"] .chip[aria-pressed="true"]')).map(x=>x.dataset.k);
  b.countries = grp('countries'); b.styles = grp('styles');
  if(S.source==='youtube'){ b.platforms = ['YouTube']; const q = $('#f-query'); b.query = (q && q.value.trim()) || b.productEn || CATS[b.category].en; }
  else b.platforms = grp('platforms');
  if(!b.countries.length){ toast('至少选一个目标国家'); return false; }
  if(!b.platforms.length){ toast('至少选一个平台'); return false; }
  return true;
}
async function doMatch(skipRead){
  if(!skipRead && !readBrief()) return;
  const b = S.brief;
  let scored;
  S.ytError = '';
  if(S.source==='youtube'){
    if(!S.ytKey){ S.ytError = '先在第 1 步填写并保存 YouTube API Key。'; render(); return; }
    S.busy='yt'; render();
    try {
      const r = await ytFetch(b);
      const f = realFilter(r.shortlist, b);
      S.busyMsg = '读取'+ctry({country:b.countries[0]})+'的 YouTube 热门榜…'; render();
      S.trending = await ytTrending(b);
      S.pool = f.pool; S.relax = f.notes; S.realStats = {searched:r.searched, channels:r.channels, detailed:r.shortlist.length, query:b.query, region:b.countries[0]};
    } catch(e){ S.busy=''; S.busyMsg=''; S.ytError = (e && e.message) || String(e); render(); return; }
    S.busy=''; S.busyMsg='';
  } else {
    const f = hardFilter(b); S.pool = f.pool; S.relax = f.notes; S.realStats = null;
  }
  scored = S.pool.map(c=>Object.assign({id:c.id, src:'rule'}, scoreOf(c,b))).sort((x,y)=>y.score-x.score);
  let top = scored.slice(0,10);
  S.rankSrc='rule';
  if(S.mode==='ai' && scored.length){
    S.busy='rank'; render();
    const cands = scored.slice(0,20).map(x=>candJson(BY_ID[x.id], x.score));
    const prompt = '你是出海品牌的达人营销助手。根据品牌需求，从候选达人里选出最合适的 10 位，按合适程度从高到低排序。\n'
      +'规则：\n- 只能使用下面给出的数据，不要编造任何数字或事实。\n- reason 用中文一句话，不超过 45 字，必须引用具体数据（如目标国家受众占比、互动率、内容方向、某条近期作品）。\n- score 为 0-100 的整数。\n- fake_pct 高、互动率远高于 er_bench、或 views_per_sub 很低的达人要降分。\n- 数据里没有的字段（比如真实频道没有受众画像）不要推测；comment_languages 只是评论语言分布，不等于受众国家。\n'
      +'只回复 JSON 数组，例如：[{"id":"c012","score":88,"reason":"……"}]\n\n'
      +'品牌需求：'+JSON.stringify({product:b.product, category:CATS[b.category].zh, countries:b.countries, platforms:b.platforms, followers:[b.followersMin,b.followersMax], budget_usd:b.budgetUsd, styles:b.styles.map(s=>STYLES[s]), gender:b.gender})+'\n\n'
      +'候选达人：\n'+cands.map(c=>JSON.stringify(c)).join('\n');
    const j = await aiJson(prompt);
    S.busy='';
    if(Array.isArray(j)){
      const seen = new Set(), byId = Object.fromEntries(scored.map(x=>[x.id,x]));
      const ai = j.filter(x=>x && byId[x.id] && !seen.has(x.id) && seen.add(x.id)).slice(0,10)
        .map(x=>Object.assign({}, byId[x.id], {score:clamp(parseInt(x.score,10)||byId[x.id].score,0,100), reason:String(x.reason||byId[x.id].reason).slice(0,90), src:'ai'}));
      if(ai.length>=5){ top=ai; S.rankSrc='ai'; }
    }
  }
  S.results = top.map((x,i)=>Object.assign(x,{rank:i+1}));
  S.lookalikeIds = new Set();
  S.selected = new Set();
  S.max = 3;
  go(3);
}

  };

function numberCheck(c, body){
  const allowed = new Set([String(c.price.lo), String(c.price.hi)]);
  (c.posts.join(' ')+' '+S.sender.brand+' '+S.sender.name+' '+S.sender.productEn).replace(/\d[\d,]*(?:\.\d+)?/g, m=>{ allowed.add(m.replace(/,/g,'')); return m; });
  const bad = [];
  body.replace(/\d[\d,]*(?:\.\d+)?/g, m=>{ const v=m.replace(/,/g,''); if(!allowed.has(v) && bad.indexOf(m)<0) bad.push(m); return m; });
  return bad;
}

/* ---------- save / restore demo progress (per browser) ---------- */
const SAVE_KEY = 'influencer_demo_state_v1';
let saveTimer = null;
function persistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
function slimCreator(c){
  const o = Object.assign({}, c);
  o.desc = String(c.desc||'').slice(0, 600);
  delete o.cmts;
  o.recent = (c.recent||[]).map(v=>({id:v.id, title:v.title, at:v.at, s:v.s, dur:v.dur, spon:v.spon, aff:v.aff, cat:v.cat, lang:v.lang, brands:v.brands}));
  return o;
}
function persist(){
  if(S.busy) return;
  try {
    const keep = new Set(S.pool.map(c=>c.id).concat(S.results.map(x=>x.id)));
    const real = Object.keys(BY_ID).map(id=>BY_ID[id]).filter(c=>c.real && keep.has(c.id));
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:1, savedAt:Date.now(), step:S.step, max:S.max, mode:S.mode, source:S.source, input:S.input,
      brief:S.brief, briefSrc:S.briefSrc, notes:S.notes, questions:S.questions,
      poolIds:S.pool.map(c=>c.id), relax:S.relax, results:S.results, rankSrc:S.rankSrc,
      selected:Array.from(S.selected), lookalikeIds:Array.from(S.lookalikeIds),
      sender:S.sender, emails:S.emails, mailSrc:S.mailSrc, checked:Array.from(S.checked), board:S.board,
      t0:S.t0, tSend:S.tSend, realStats:S.realStats, trending:S.trending, real:real.map(slimCreator)
    }));
  } catch(e){}
}
function restore(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(!d || d.v!==1) return false;
    if(d.source==='youtube' && IN_ARTIFACT) return false;
    (d.real||[]).forEach(c=>{ BY_ID[c.id] = c; });
    Object.assign(S, {
      step:d.step||1, max:d.max||1, source:d.source||'sample', input:d.input||S.input,
      brief:d.brief||null, briefSrc:d.briefSrc||'', notes:d.notes||[], questions:d.questions||[],
      pool:(d.poolIds||[]).map(id=>BY_ID[id]).filter(Boolean), relax:d.relax||[],
      results:(d.results||[]).filter(x=>BY_ID[x.id]), rankSrc:d.rankSrc||'',
      selected:new Set((d.selected||[]).filter(id=>BY_ID[id])), lookalikeIds:new Set(d.lookalikeIds||[]),
      sender:d.sender||S.sender, emails:d.emails||{}, mailSrc:d.mailSrc||'', checked:new Set(d.checked||[]),
      board:d.board||{}, t0:d.t0||null, tSend:d.tSend||null, realStats:d.realStats||null, trending:d.trending||null,
      savedMode:d.mode
    });
    if(!S.brief){ S.step = 1; S.max = 1; }
    return S.step>1;
  } catch(e){ return false; }
}

    if(!IN_ARTIFACT){
      S.step = 1; render();
      const el = $('#ds-key'); if(el){ el.scrollIntoView({block:'center'}); el.focus(); }
      toast(S.dsStatus && S.dsStatus.lv==='bad' ? 'AI 模式不可用：'+S.dsStatus.t : '先在第 1 步填 DeepSeek API Key，再点“测试连接”');
    }
    return;
  }
  if(t.id==='mode-rule'){ S.mode='rule'; render(); return; }
  if((t.id==='src-sample' || t.id==='src-yt') && !t.disabled){
    const src = t.id==='src-yt' ? 'youtube' : 'sample';
    if(src!==S.source){ Object.assign(S,{source:src,step:1,max:1,brief:null,results:[],pool:[],selected:new Set(),emails:{},checked:new Set(),board:{},t0:null,tSend:null,ytError:'',realStats:null,trending:null}); render(); }
    return;
  }
  if(d.go){ go(parseInt(d.go,10)); return; }
  if(d.preset){ S.input = PRESETS[+d.preset].text; $('#need').value = S.input; return; }
  if(d.k && t.closest('[data-group]')){ t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed')!=='true')); return; }
  if(d.sel){ if(t.checked) S.selected.add(d.sel); else S.selected.delete(d.sel); render(); return; }
  if(d.detail){ openDrawer(d.detail); return; }
  if(d.toggle){ if(S.selected.has(d.toggle)) S.selected.delete(d.toggle); else S.selected.add(d.toggle); render(); openDrawer(d.toggle); return; }
  if(d.similar){ showSimilar(d.similar); return; }
  if(d.addsim){ const from = $('#sheet [data-similar]'); addSimilar(d.addsim); if(from) showSimilar(from.dataset.similar); return; }
  if(d.remove){ S.selected.delete(d.remove); render(); return; }
  if(d.check){ if(t.checked) S.checked.add(d.check); else S.checked.delete(d.check); render(); return; }
  if(d.move){ const [id,st] = d.move.split(':'); S.board[id]=st; render(); return; }
  if(d.copy){ const v = d.copy; try { navigator.clipboard.writeText(v).then(()=>toast('已复制'), ()=>toast('复制失败，请手动选中复制')); } catch(e){ toast('复制失败，请手动选中复制'); } return; }
  switch(d.act){
    case 'close': closeDrawer(); break;
    case 'saveKey': { const k = $('#yt-key').value.trim(); if(!k){ toast('先粘贴 API Key'); break; } S.ytKey = k; saveKey(k); toast('Key 已保存在这台电脑的浏览器里'); render(); break; }
    case 'clearKey': S.ytKey=''; saveKey(''); toast('Key 已清除'); render(); break;
    case 'saveDs': { const k = $('#ds-key').value.trim(); if(!k){ toast('先粘贴 DeepSeek API Key'); break; } S.dsKey = k; saveDsKey(k); S.aiAvailable = true; S.mode = 'ai'; S.dsStatus = null; toast('DeepSeek Key 已保存，建议点“测试连接”确认一下'); render(); break; }
    case 'testDs': {
      const k = $('#ds-key').value.trim(); if(!k){ toast('先粘贴 DeepSeek API Key'); break; }
      S.dsKey = k; saveDsKey(k); S.dsStatus = {lv:'neutral', t:'正在测试…'}; render();
      dsPing().then(st => { S.dsStatus = st; if(st.lv==='good'){ S.aiAvailable = true; S.mode = 'ai'; } else { S.aiAvailable = false; S.mode = 'rule'; } render(); });
      break;
    }
    case 'clearDs': S.dsKey=''; S.dsStatus=null; saveDsKey(''); if(!IN_ARTIFACT){ S.aiAvailable=false; S.mode='rule'; } toast('DeepSeek Key 已清除'); render(); break;
    case 'parse': doParse(); break;
    case 'match': doMatch(); break;
    case 'rerank': S.step=2; doMatch(true); break;
    case 'toReview': S.max=Math.max(S.max,4); go(4); break;
    case 'toMail': S.max=Math.max(S.max,5); go(5); break;
    case 'genMail': doGenMail(); break;
    case 'send': doSend(); break;
    case 'restart': Object.assign(S,{step:1,max:1,brief:null,results:[],pool:[],selected:new Set(),emails:{},checked:new Set(),board:{},t0:null,tSend:null,ytError:'',realStats:null,trending:null}); render(); break;
  }
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if(e.target.id==='need') S.input = e.target.value;
  if(d.subj && S.emails[d.subj]) S.emails[d.subj].subject = e.target.value;
  if(d.body && S.emails[d.body]){
    S.emails[d.body].body = e.target.value;
    const box = document.getElementById('chk-'+d.body);
    if(box) box.innerHTML = checkTags(numberCheck(BY_ID[d.body], e.target.value));
    if(S.checked.has(d.body)){ S.checked.delete(d.body); const cb=document.querySelector('[data-check="'+d.body+'"]'); if(cb) cb.checked=false; const sb=$('#send-btn'); if(sb) sb.disabled=true; }
  }
  if(e.target.id==='s-brand') S.sender.brand = e.target.value;
  if(e.target.id==='s-name') S.sender.name = e.target.value;
  if(e.target.id==='s-prod') S.sender.productEn = e.target.value;
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#drawer').hidden) closeDrawer(); });

const restored = restore();
render();
if(restored) toast('已恢复上次的演示进度。想从头开始，点左下角“重新开始”。');
(async function(){
  try { if(window.claude && typeof window.claude.use==='function'){ sampleFn = await window.claude.use('sample'); } } catch(e){ sampleFn = null; }
  if(sampleFn){ S.aiAvailable = true; S.mode = 'ai'; render(); }
})();
if(!IN_ARTIFACT && S.dsKey){ S.aiAvailable = true; S.mode = S.savedMode==='rule' ? 'rule' : 'ai'; render(); }
})();
</script>

</body></html>
